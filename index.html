  /* ============ bottom sheet ============ */
  var elSheet = document.getElementById('sheet');
  var elBack = document.getElementById('backdrop');
  function abrir(html){
    elSheet.innerHTML = '<div class="puxador"></div>' + html;
    elBack.classList.add('on');
    requestAnimationFrame(function(){ elSheet.classList.add('on'); });
  }
  function fechar(){
    elSheet.classList.remove('on');
    elBack.classList.remove('on');
    setTimeout(function(){ if (!elSheet.classList.contains('on')) elSheet.innerHTML = ''; }, 340);
  }
  elBack.addEventListener('click', fechar);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') fechar(); });

  function cabecalho(cor, titulo){
    return '<div class="sheet-cab"><span class="chip" style="background:' + esc(cor || '#A56B3E') + '"></span>'
      + '<h3>' + esc(titulo) + '</h3>'
      + '<button class="fechar" data-acao="fechar" aria-label="Fechar" type="button">✕</button></div>';
  }

  /* ---- teclado de lançamento ---- */
  var MODOS = {
    vender:[
      {k:'venda',  t:'Vender',  s:'sai da prateleira'},
      {k:'ajuste', t:'Ajustar', s:'contagem certa'}
    ]
  };
  var kp = {id:null, contexto:'vender', modo:'venda', txt:''};

  function abrirTeclado(id, contexto, modo){
    escoar();
    var s = acharSabor(id);
    if (!s) return;
    kp = {id:id, contexto:contexto, modo:modo || MODOS[contexto][0].k, txt:''};
    abrir(cabecalho(s.cor, s.nome) + '<div id="kp"></div>');
    pintarTeclado();
  }
  function pintarTeclado(){
    var alvo = document.getElementById('kp');
    if (!alvo) return;
    var s = acharSabor(kp.id);
    if (!s){ fechar(); return; }
    var aV = nn(s.qtd), aA = nn(s.crus);
    var digitado = kp.txt === '' ? null : parseInt(kp.txt, 10);
    var padrao = kp.modo === 'ajuste' ? aV : kp.modo === 'ajusteAssar' ? aA : 0;
    var base = digitado == null ? padrao : digitado;
    var dV = aV, dA = aA;
    if (kp.modo === 'venda') dV = Math.max(0, aV - base);
    else if (kp.modo === 'massa') dA = aA + base;
    else if (kp.modo === 'assar'){ dA = Math.max(0, aA - base); dV = aV + base; }
    else if (kp.modo === 'ajuste') dV = base;
    else if (kp.modo === 'ajusteAssar') dA = base;

    var previa;
    if (kp.modo === 'venda') previa = 'Pra vender: <b>' + aV + '</b> → <b>' + dV + '</b> · ' + moeda(base * nn(s.preco));
    else if (kp.modo === 'assar') previa = 'Pra assar: <b>' + aA + '</b> → <b>' + dA + '</b> · pra vender: <b>' + aV + '</b> → <b>' + dV + '</b>';
    else if (kp.modo === 'massa' || kp.modo === 'ajusteAssar') previa = 'Pra assar: <b>' + aA + '</b> → <b>' + dA + '</b>';
    else previa = 'Pra vender: <b>' + aV + '</b> → <b>' + dV + '</b>';

    var lista = MODOS[kp.contexto];
    var h = '<div class="modos" role="group" aria-label="Tipo de lançamento" style="grid-template-columns:repeat('
      + lista.length + ',1fr)">';
    lista.forEach(function(m){
      h += '<button data-modo="' + m.k + '" aria-pressed="' + (kp.modo === m.k) + '" type="button">'
        + m.t + '<small>' + m.s + '</small></button>';
    });
    h += '</div>';
    h += '<div class="visor"><div class="num' + (digitado == null ? ' vazio-num' : '') + '">' + base
      + '</div><div class="previa">' + previa + '</div></div>';
    h += '<div class="teclado">';
    ['1','2','3','4','5','6','7','8','9'].forEach(function(d){ h += '<button data-tecla="' + d + '" type="button">' + d + '</button>'; });
    h += '<button class="aux" data-tecla="C" type="button">limpar</button>'
      + '<button data-tecla="0" type="button">0</button>'
      + '<button class="aux" data-tecla="B" aria-label="Apagar último dígito" type="button">' + ICO_APAGA + '</button>';
    h += '</div>';
    h += '<button class="btn full" data-acao="confirmar" type="button">' + TITULO_BOTAO[kp.modo] + '</button>';
    alvo.innerHTML = h;
  }

  /* ---- sheet de sabor ---- */
  function abrirSabor(id){
    escoar();
    var s = id ? acharSabor(id) : null;
    if (id && !s) return;
    var novo = !s;
    var cor = s ? (s.cor || CORES[3]) : CORES[3];
    var h = cabecalho(cor, novo ? 'Novo sabor' : s.nome);
    h += '<label class="campo"><span>Nome</span><input id="f-nome" type="text" autocapitalize="words" value="' + esc(s ? s.nome : '') + '" placeholder="Ex.: Red Velvet"></label>';
    h += '<div class="dupla">'
      + '<label class="campo"><span>Preço</span><input id="f-preco" type="text" inputmode="decimal" value="' + (s ? precoBR(s.preco) : '') + '" placeholder="12,00"></label>'
      + '<label class="campo"><span>Avisar abaixo de</span><input id="f-min" type="text" inputmode="numeric" value="' + (s ? nn(s.minimo) : '6') + '" placeholder="6"></label>'
      + '</div>';
    h += '<div class="campo"><span>Cor do sabor</span><div class="cores" id="f-cores">';
    CORES.forEach(function(c){
      h += '<button data-cor="' + c + '" aria-pressed="' + (c.toLowerCase() === String(cor).toLowerCase()) + '" style="background:' + c + '" aria-label="Cor ' + c + '" type="button"></button>';
    });
    h += '</div></div>';
    h += '<div class="acoes-sheet"><button class="btn" data-acao="salvar-sabor" data-id="' + esc(id || '') + '" type="button">'
      + (novo ? 'Cadastrar' : 'Salvar') + '</button>';
    if (!novo) h += '<button class="btn perigo" data-acao="excluir-sabor" data-id="' + esc(id) + '" type="button">Excluir</button>';
    h += '</div>';
    abrir(h);
  }

  /* ---- planilha do dia (.xlsx de verdade, 4 abas) ---- */
  var promXLSX = null;
  function carregarXLSX(){
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (promXLSX) return promXLSX;
    promXLSX = new Promise(function(aceita, recusa){
      var t = document.createElement('script');
      t.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      t.onload = function(){ window.XLSX ? aceita(window.XLSX) : recusa(new Error('biblioteca sem XLSX')); };
      t.onerror = function(){ recusa(new Error('não deu para baixar a biblioteca')); };
      document.head.appendChild(t);
      setTimeout(function(){ if (!window.XLSX) recusa(new Error('a biblioteca demorou demais')); }, 15000);
    }).catch(function(e){ promXLSX = null; throw e; });
    return promXLSX;
  }

  var Z_REAL = 'R$ #,##0.00', Z_PCT = '0.0%';
  function dataBR(dia){ return dia.split('-').reverse().join('/'); }

  /* monta as quatro abas do fechamento de um dia */
  function livroDoDia(XLSX, dia){
    var f = fechamento(dia), movs = movsDoDia(dia), hoje = dia === hojeISO();
    var wb = XLSX.utils.book_new();
    var semana = new Intl.DateTimeFormat('pt-BR', {weekday:'long'}).format(new Date(dia + 'T12:00:00'));
    var ontem = doDia(diaMenos(1)), media = mediaAnterior(7);
    var precoMedio = f.tot.vendidos ? f.tot.faturamento / f.tot.vendidos : 0;
    var top = f.ordem.length && f.por[f.ordem[0]].vendidos ? f.por[f.ordem[0]] : null;
    var fornos = 0, sabVendidos = 0;
    f.ordem.forEach(function(k){ fornos += f.por[k].fornos; if (f.por[k].vendidos) sabVendidos++; });

    /* 1. Resumo — cada linha diz se o valor é dinheiro, para o formato
       acompanhar a linha em vez de depender de endereço fixo de célula */
    var R = [
      ['Doceria Maria Formiga'],
      ['Fechamento do dia', dataBR(dia)],
      ['Dia da semana', maiusc1(semana)],
      ['Gerado em', dataBR(hojeISO()) + ' ' + HORA.format(new Date())],
      [],
      ['O DIA'],
      ['Unidades vendidas', f.tot.vendidos],
      ['Faturamento', f.tot.faturamento, Z_REAL],
      ['Preço médio por unidade', precoMedio, Z_REAL],
      ['Sabores que venderam', sabVendidos],
      ['Mais vendido', top ? top.nome + ' (' + top.vendidos + ' un)' : '—'],
      ['Lançamentos no dia', f.tot.lancamentos],
      ['Ajustes de contagem', f.tot.ajustes],
      ['Foi para o forno', fornos],
      []
    ];
    if (hoje){
      R.push(['COMPARAÇÕES']);
      R.push(['Ontem — unidades', ontem.vendidos]);
      R.push(['Ontem — faturamento', ontem.faturamento, Z_REAL]);
      R.push(['Diferença — unidades', f.tot.vendidos - ontem.vendidos]);
      R.push(['Diferença — faturamento', f.tot.faturamento - ontem.faturamento, Z_REAL]);
      R.push(['Média por dia dos 7 dias anteriores — unidades', Math.round(media.vendidos * 10) / 10]);
      R.push(['Média por dia dos 7 dias anteriores — faturamento', media.faturamento, Z_REAL]);
      R.push([]);
    }
    if (!hoje) R.push(['Observação', 'A aba de estoque mostra o estoque de hoje, não o do fim daquele dia.']);
    var wsR = XLSX.utils.aoa_to_sheet(R.map(function(l){ return [l[0], l[1]]; }));
    R.forEach(function(l, i){
      var cel = wsR['B' + (i + 1)];
      if (l[2] && cel) cel.z = l[2];
    });
    wsR['!cols'] = [{wch:44}, {wch:26}];
    XLSX.utils.book_append_sheet(wb, wsR, 'Resumo');

    /* 2. Por sabor */
    var PS = [['Sabor', 'Preço un.', 'Vendidos', 'Faturamento', '% do faturamento', 'Pro forno', 'Ajustes']];
    f.ordem.forEach(function(k){
      var x = f.por[k];
      var pu = x.vendidos ? x.faturamento / x.vendidos : precoUn(k);
      PS.push([x.nome, nn(pu),
               x.vendidos, x.faturamento,
               f.tot.faturamento ? x.faturamento / f.tot.faturamento : 0,
               x.fornos, x.ajustes]);
    });
    PS.push([]);
    PS.push(['TOTAL', '', f.tot.vendidos, f.tot.faturamento, f.tot.faturamento ? 1 : 0, fornos, f.tot.ajustes]);
    var wsS = XLSX.utils.aoa_to_sheet(PS);
    for (var i = 2; i <= PS.length; i++){
      ['B', 'D'].forEach(function(col){ if (wsS[col + i]) wsS[col + i].z = Z_REAL; });
      if (wsS['E' + i]) wsS['E' + i].z = Z_PCT;
    }
    wsS['!cols'] = [{wch:20}, {wch:12}, {wch:11}, {wch:14}, {wch:17}, {wch:11}, {wch:9}];
    XLSX.utils.book_append_sheet(wb, wsS, 'Por sabor');

    /* 3. Lançamentos */
    var LC = [['Hora', 'Sabor', 'Lançamento', 'Quantidade', 'Valor un.', 'Valor total', 'Pra vender depois', 'Pra assar depois']];
    movs.slice().reverse().forEach(function(m){
      var venda = m.tipo === 'venda';
      LC.push([
        HORA.format(new Date(m.ts)), m.sabor, ROTULO[m.tipo] || m.tipo, nn(m.qtd),
        venda ? nn(m.preco) : '', venda ? nn(m.valor) : '',
        nn(m.depoisVender), nn(m.depoisAssar)
      ]);
    });
    if (movs.length === 0) LC.push(['—', 'Nenhum lançamento neste dia', '', '', '', '', '', '']);
    var wsL = XLSX.utils.aoa_to_sheet(LC);
    for (var j = 2; j <= LC.length; j++){
      ['E', 'F'].forEach(function(col){ if (wsL[col + j]) wsL[col + j].z = Z_REAL; });
    }
    wsL['!cols'] = [{wch:8}, {wch:20}, {wch:20}, {wch:12}, {wch:11}, {wch:13}, {wch:18}, {wch:17}];
    XLSX.utils.book_append_sheet(wb, wsL, 'Lançamentos');

    /* 4. Estoque */
    var EQ = [['Sabor', 'Pra vender', 'Pra assar', 'Preço', 'Mínimo', 'Valor em estoque', 'Situação']];
    var totQ = 0, totC = 0, totV = 0;
    S.sabores.forEach(function(x){
      var q = nn(x.qtd), c = nn(x.crus), v = q * nn(x.preco);
      totQ += q; totC += c; totV += v;
      EQ.push([x.nome, q, c, nn(x.preco), nn(x.minimo), v, situacao(x).txt]);
    });
    EQ.push([]);
    EQ.push(['TOTAL', totQ, totC, '', '', totV, '']);
    var wsE = XLSX.utils.aoa_to_sheet(EQ);
    for (var k2 = 2; k2 <= EQ.length; k2++){
      ['D', 'F'].forEach(function(col){ if (wsE[col + k2]) wsE[col + k2].z = Z_REAL; });
    }
    wsE['!cols'] = [{wch:20}, {wch:12}, {wch:11}, {wch:10}, {wch:9}, {wch:17}, {wch:15}];
    XLSX.utils.book_append_sheet(wb, wsE, hoje ? 'Estoque no fim do dia' : 'Estoque hoje');

    return wb;
  }
  function precoUn(saborId){
    var s = acharSabor(saborId);
    return s ? nn(s.preco) : 0;
  }

  function planilhaDoDia(dia){
    toast('Montando a planilha…', 'Fechamento de ' + dataBR(dia));
    var nome = 'fechamento-maria-formiga-' + dia + '.xlsx';
    carregarXLSX().then(function(XLSX){
      var buf = XLSX.write(livroDoDia(XLSX, dia), {bookType:'xlsx', type:'array'});
      var blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      if (window.claude && typeof window.claude.use === 'function'){
        return window.claude.use('downloads').then(function(d){
          if (!d) throw new Error('sem download');
          return d.save({filename:nome, data:blob}).then(function(){
            toast('Planilha salva', nome);
          }, function(e){
            if (e && e.code === 'declined') { esconderToast(); return; }
            throw new Error('o download foi recusado');
          });
        });
      }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = nome;
      document.body.appendChild(a); a.click(); a.remove();
      toast('Planilha gerada', nome);
    }).catch(function(e){
      abrirCSVdoDia(dia, e && e.message ? e.message : 'não deu para gerar o arquivo');
    });
  }

  /* se o .xlsx não puder ser gerado, o mesmo fechamento em texto */
  function csvDoDia(dia){
    var f = fechamento(dia), movs = movsDoDia(dia), L = [];
    L.push('FECHAMENTO DO DIA;' + dataBR(dia));
    L.push('Unidades vendidas;' + f.tot.vendidos);
    L.push('Faturamento;' + precoBR(f.tot.faturamento));
    L.push('Lancamentos;' + f.tot.lancamentos);
    L.push('Ajustes;' + f.tot.ajustes);
    L.push('');
    L.push('POR SABOR');
    L.push('Sabor;Vendidos;Faturamento;Pro forno;Ajustes');
    f.ordem.forEach(function(k){
      var x = f.por[k];
      L.push([x.nome, x.vendidos, precoBR(x.faturamento), x.fornos, x.ajustes].join(';'));
    });
    L.push('');
    L.push('LANCAMENTOS');
    L.push('Hora;Sabor;Lancamento;Quantidade;Valor');
    movs.slice().reverse().forEach(function(m){
      L.push([HORA.format(new Date(m.ts)), m.sabor, ROTULO[m.tipo] || m.tipo, nn(m.qtd), precoBR(m.valor)].join(';'));
    });
    L.push('');
    L.push('ESTOQUE');
    L.push('Sabor;Pra vender;Pra assar;Preco;Minimo;Valor');
    S.sabores.forEach(function(x){
      L.push([x.nome, nn(x.qtd), nn(x.crus), precoBR(x.preco), nn(x.minimo), precoBR(nn(x.qtd) * nn(x.preco))].join(';'));
    });
    return L.join('\r\n');
  }
  function abrirCSVdoDia(dia, motivo){
    esconderToast();
    var h = cabecalho('#A56B3E', 'Fechamento de ' + dataBR(dia));
    h += '<p class="aviso">Não deu para montar o arquivo .xlsx aqui (' + esc(motivo)
      + '). O mesmo fechamento está abaixo em texto — toque em Copiar e cole na sua planilha.</p>';
    h += '<textarea class="csv" id="f-csv" readonly>' + esc(csvDoDia(dia)) + '</textarea>';
    h += '<div class="acoes-sheet"><button class="btn" data-acao="copiar-csv" type="button">Copiar</button>'
      + '<button class="btn fantasma" data-acao="fechar" type="button">Fechar</button></div>';
    abrir(h);
  }

  /* ---- exportar ---- */
  function montarCSV(){
    var L = [];
    L.push('ESTOQUE AGORA');
    L.push('Sabor;Pra vender;Pra assar;Preco;Minimo;Valor em estoque');
    S.sabores.forEach(function(s){
      var q = nn(s.qtd);
      L.push([s.nome, q, nn(s.crus), precoBR(s.preco), nn(s.minimo), precoBR(q * nn(s.preco))].join(';'));
    });

    var dias = [];
    S.movs.forEach(function(m){
      var d = diaDe(m);
      if (dias.indexOf(d) < 0) dias.push(d);
    });
    dias.sort();

    L.push('');
    L.push('FECHAMENTO POR DIA');
    L.push('Data;Vendidos;Faturamento;Ajustes;Lancamentos');
    dias.forEach(function(d){
      var f = fechamento(d);
      L.push([d.split('-').reverse().join('/'), f.tot.vendidos, precoBR(f.tot.faturamento),
              f.tot.ajustes, f.tot.lancamentos].join(';'));
    });

    L.push('');
    L.push('POR SABOR, POR DIA');
    L.push('Data;Sabor;Vendidos;Faturamento;Ajustes');
    dias.forEach(function(d){
      var f = fechamento(d);
      f.ordem.forEach(function(k){
        var x = f.por[k];
        L.push([d.split('-').reverse().join('/'), x.nome, x.vendidos, precoBR(x.faturamento), x.ajustes].join(';'));
      });
    });

    L.push('');
    L.push('LANCAMENTOS');
    L.push('Data;Hora;Sabor;Lancamento;Pra vender;Pra assar;Valor');
    S.movs.slice().reverse().forEach(function(m){
      var d = new Date(m.ts);
      L.push([
        diaDe(m).split('-').reverse().join('/'), HORA.format(d), m.sabor, ROTULO[m.tipo] || m.tipo,
        (m.dVender == null ? nn(m.delta) : nn(m.dVender)), nn(m.dAssar), precoBR(m.valor)
      ].join(';'));
    });
    return L.join('\r\n');
  }
  function abrirCSV(){
    var h = cabecalho('#A56B3E', 'Exportar planilha');
    h += '<p class="aviso">Arquivo CSV com ponto e vírgula e vírgula decimal — abre direto no Excel, Numbers e Google Sheets.</p>';
    h += '<textarea class="csv" id="f-csv" readonly>' + esc(montarCSV()) + '</textarea>';
    h += '<div class="acoes-sheet"><button class="btn" data-acao="baixar-csv" type="button">Baixar arquivo</button>'
      + '<button class="btn fantasma" data-acao="copiar-csv" type="button">Copiar</button></div>';
    abrir(h);
  }
  function semDownload(){
    toast('Use o botão Copiar', 'Aqui o download é bloqueado — cole o texto na sua planilha.');
  }
  function alvoManual(csv, nome){
    try {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
      a.download = nome; document.body.appendChild(a); a.click(); a.remove();
      toast('Arquivo gerado', nome);
    } catch (e) { semDownload(); }
  }
  function baixarCSV(){
    var csv = '\ufeff' + montarCSV();
    var nome = 'maria-formiga-' + hojeISO() + '.csv';
    if (window.claude && typeof window.claude.use === 'function'){
      window.claude.use('downloads').then(function(d){
        if (!d) return semDownload();
        d.save({filename:nome, data:csv}).then(function(){
          fechar(); toast('Arquivo salvo', nome);
        }).catch(function(e){
          if (e && e.code === 'declined') return;
          semDownload();
        });
      }).catch(function(){ semDownload(); });
    } else alvoManual(csv, nome);
  }

  /* ---- apagar lançamento / limpar tudo ---- */
  function abrirApagarMov(id){
    var m = null;
    S.movs.forEach(function(x){ if (x.id === id) m = x; });
    if (!m) return;
    var h = cabecalho(m.cor, 'Apagar lançamento');
    h += '<p class="aviso"><b>' + esc(ROTULO[m.tipo] || m.tipo) + ' de ' + nn(m.qtd) + ' ' + esc(m.sabor)
      + '</b>. Ao apagar, as quantidades voltam ao que eram antes deste lançamento.</p>';
    h += '<div class="acoes-sheet"><button class="btn perigo" data-acao="confirmar-apagar-mov" data-id="' + esc(id) + '" type="button">Apagar</button>'
      + '<button class="btn fantasma" data-acao="fechar" type="button">Manter</button></div>';
    abrir(h);
  }
  function reverter(m){
    var s = acharSabor(m.saborId);
    if (!s) return Promise.resolve();
    var dV = (m.dVender == null ? nn(m.delta) : nn(m.dVender)), dA = nn(m.dAssar);
    return atualizarSabor(m.saborId, {
      qtd:Math.max(0, nn(s.qtd) - dV),
      crus:Math.max(0, nn(s.crus) - dA)
    });
  }
  function limparTudo(){
    var movs = S.movs.slice(), sabores = S.sabores.slice();
    fechar();
    var passos = sabores.map(function(x){
      return function(){ return atualizarSabor(x.id, {qtd:0, crus:0}); };
    }).concat(movs.map(function(m){
      return function(){ return removerMov(m.id); };
    }));
    if (!passos.length) return;
    toast('Limpando…', passos.length + ' registro' + (passos.length === 1 ? '' : 's'));
    (function proximo(i){
      if (i >= passos.length){
        toast('Tudo limpo', 'Contagens zeradas e histórico apagado. Sabores e preços continuam.');
        return;
      }
      Promise.resolve().then(passos[i]).then(function(){ proximo(i + 1); }, function(){ proximo(i + 1); });
    })(0);
  }
  function abrirLimpar(){
    var h = cabecalho('#AE3527', 'Começar do zero');
    h += '<p class="aviso">Apaga <b>todos os ' + S.movs.length + ' lançamentos</b> do histórico e zera o "pra vender" e o "pra assar" dos '
      + S.sabores.length + ' sabores. Sabores, preços, mínimos e cores continuam como estão. Não tem como desfazer.</p>';
    h += '<div class="acoes-sheet"><button class="btn perigo" data-acao="confirmar-limpar" type="button">Apagar e zerar</button>'
      + '<button class="btn fantasma" data-acao="fechar" type="button">Cancelar</button></div>';
    abrir(h);
  }

  /* ============ trava de acesso ============ */
  var SELO = document.querySelector('.appbar .selo').getAttribute('src');
  var trava = {txt:'', fase:'entrar', primeira:'', hash:undefined, erro:''};

  function abertoAgora(){
    try { return Number(localStorage.getItem(CHAVE_ABERTO) || 0) > Date.now(); } catch (e) { return false; }
  }
  function marcarAberto(){
    try { localStorage.setItem(CHAVE_ABERTO, String(Date.now() + JANELA)); } catch (e) {}
  }
  function hashSimples(t){
    var h = 0x811c9dc5, g = 0x1000193, i;
    for (i = 0; i < t.length; i++){
      h = ((h ^ t.charCodeAt(i)) * 16777619) >>> 0;
      g = ((g + t.charCodeAt(i) * 131) * 33) >>> 0;
    }
    return 'f' + h.toString(16) + g.toString(16);
  }
  function hashSenha(pin){
    var txt = 'maria-formiga::' + pin;
    try {
      if (window.crypto && window.crypto.subtle && window.TextEncoder){
        return window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)).then(function(buf){
          return Array.prototype.map.call(new Uint8Array(buf), function(x){
            return ('0' + x.toString(16)).slice(-2);
          }).join('');
        }).catch(function(){ return hashSimples(txt); });
      }
    } catch (e) {}
    return Promise.resolve(hashSimples(txt));
  }
  function hashLocal(){ try { return localStorage.getItem(CHAVE_SENHA) || null; } catch (e) { return null; } }
  function prepararTrava(){
    if (S.travaPronta) return;
    var fim = function(h){
      trava.hash = h;
      trava.fase = h ? 'entrar' : 'criar';
      S.travaPronta = true;
      pintarTrava();
    };
    if (S.db){
      S.db.doc('config/acesso').get().then(function(d){
        var v = d.exists ? (d.data() || {}).senha : null;
        fim(v || hashLocal());
      }, function(){ fim(hashLocal()); });
    } else fim(hashLocal());
  }
  function gravarSenha(h){
    try { localStorage.setItem(CHAVE_SENHA, h); } catch (e) {}
    if (S.db) return S.db.doc('config/acesso').set({senha:h, em:new Date().toISOString()}).catch(function(){});
    return Promise.resolve();
  }
  function destrancar(){
    marcarAberto();
    S.trancado = false;
    trava.txt = ''; trava.erro = '';
    pintarTrava();
    render();
  }
  function trancarApp(){
    try { localStorage.removeItem(CHAVE_ABERTO); } catch (e) {}
    escoar();
    fechar();
    S.trancado = true;
    trava.txt = ''; trava.erro = '';
    trava.fase = trava.hash ? 'entrar' : 'criar';
    pintarTrava();
  }
  function tremer(){
    var el = document.querySelector('.trava .pontos');
    if (!el) return;
    el.classList.remove('tremendo');
    void el.offsetWidth;
    el.classList.add('tremendo');
  }
  function pintarTrava(){
    var el = document.getElementById('trava');
    if (!S.trancado){ el.hidden = true; el.innerHTML = ''; document.body.classList.remove('trancado'); return; }
    el.hidden = false;
    document.body.classList.add('trancado');
    var titulo, ajuda;
    if (!S.travaPronta){ titulo = 'Maria Formiga'; ajuda = 'Carregando…'; }
    else if (trava.fase === 'criar'){ titulo = 'Crie sua senha'; ajuda = 'Quatro números que só você sabe. É o que vai abrir o app daqui pra frente.'; }
    else if (trava.fase === 'confirmar'){ titulo = 'Repita a senha'; ajuda = 'Só para confirmar que ficou do jeito que você quis.'; }
    else { titulo = 'Sua senha'; ajuda = 'Quatro números.'; }
    if (trava.erro) ajuda = trava.erro;

    var h = '<img class="selo-grande" src="' + SELO + '" alt="Doceria Maria Formiga">'
      + '<h1>' + esc(titulo) + '</h1>'
      + '<p class="ajuda' + (trava.erro ? ' erro' : '') + '">' + esc(ajuda) + '</p>'
      + '<div class="pontos" aria-hidden="true">';
    for (var i = 0; i < 4; i++) h += '<i class="' + (trava.txt.length > i ? 'on' : '') + '"></i>';
    h += '</div><div class="teclado">';
    ['1','2','3','4','5','6','7','8','9'].forEach(function(d){
      h += '<button data-pin="' + d + '"' + (S.travaPronta ? '' : ' disabled') + ' type="button">' + d + '</button>';
    });
    h += '<span></span><button data-pin="0"' + (S.travaPronta ? '' : ' disabled') + ' type="button">0</button>'
      + '<button class="aux" data-pin="B" aria-label="Apagar" type="button">' + ICO_APAGA + '</button>';
    h += '</div>';
    if (S.travaPronta && trava.fase === 'entrar'){
      h += '<button class="btn destrancar" data-pin="?" type="button">Esqueci minha senha</button>';
    }
    el.innerHTML = h;
  }
  function digitarPin(t){
    if (!S.travaPronta) return;
    trava.erro = '';
    if (t === '?'){
      trava.erro = S.fonte === 'nuvem'
        ? 'Me peça no chat do Claude para redefinir a senha — eu apago a atual e você cria outra.'
        : 'Limpe os dados deste site no navegador (Ajustes → Safari) e o app pede uma senha nova.';
      pintarTrava();
      return;
    }
    if (t === 'B') trava.txt = trava.txt.slice(0, -1);
    else if (trava.txt.length < 4) trava.txt += t;
    pintarTrava();
    if (trava.txt.length === 4) setTimeout(conferirPin, 190);
  }
  function conferirPin(){
    var pin = trava.txt;
    if (pin.length !== 4) return;
    if (trava.fase === 'criar'){
      trava.primeira = pin; trava.txt = ''; trava.fase = 'confirmar';
      pintarTrava();
      return;
    }
    if (trava.fase === 'confirmar'){
      if (pin !== trava.primeira){
        trava.txt = ''; trava.fase = 'criar'; trava.erro = 'As duas senhas não bateram. Vamos de novo.';
        pintarTrava(); tremer();
        return;
      }
      hashSenha(pin).then(function(h){
        trava.hash = h;
        return gravarSenha(h);
      }).then(function(){
        toast('Senha criada', 'Só ela abre o app agora.');
        destrancar();
      });
      return;
    }
    hashSenha(pin).then(function(h){
      if (h === trava.hash){ destrancar(); return; }
      trava.txt = ''; trava.erro = 'Senha errada. Tente outra vez.';
      pintarTrava(); tremer();
    });
  }

  /* ============ toques ============ */
  document.addEventListener('click', function(e){
    if (!e.target.closest) return;

    var pin = e.target.closest('[data-pin]');
    if (pin){ digitarPin(pin.getAttribute('data-pin')); return; }

    var v1 = e.target.closest('[data-vender1]');
    if (v1){
      var sv = acharSabor(v1.getAttribute('data-vender1'));
      if (sv) vender1(sv);
      return;
    }

    var b = e.target.closest('[data-acao],[data-tecla],[data-modo],[data-cor]');
    if (!b) return;

    if (b.hasAttribute('data-tecla')){
      var t = b.getAttribute('data-tecla');
      if (t === 'C') kp.txt = '';
      else if (t === 'B') kp.txt = kp.txt.slice(0, -1);
      else if (kp.txt.length < 5) kp.txt = (kp.txt === '0' ? '' : kp.txt) + t;
      pintarTeclado();
      return;
    }
    if (b.hasAttribute('data-modo')){ kp.modo = b.getAttribute('data-modo'); kp.txt = ''; pintarTeclado(); return; }
    if (b.hasAttribute('data-cor')){
      Array.prototype.forEach.call(b.parentNode.children, function(o){ o.setAttribute('aria-pressed', String(o === b)); });
      return;
    }

    var acao = b.getAttribute('data-acao'), id = b.getAttribute('data-id');
    if (acao === 'fechar') return fechar();
    if (acao === 'trancar') return trancarApp();
    if (acao === 'lancar-vender') return abrirTeclado(id, 'vender');
    if (acao === 'editar') return abrirSabor(id);
    if (acao === 'novo-sabor') return abrirSabor(null);
    if (acao === 'csv') return abrirCSV();
    if (acao === 'baixar-csv') return baixarCSV();
    if (acao === 'limpar') return abrirLimpar();
    if (acao === 'confirmar-limpar'){ if (ocupado()) return; return limparTudo(); }
    if (acao === 'planilha-dia') return planilhaDoDia(b.getAttribute('data-dia'));
    if (acao === 'abrir-dia'){
      var dia = b.getAttribute('data-dia');
      diasAbertos[dia] = !diasAbertos[dia];
      render();
      return;
    }
    if (acao === 'apagar-mov') return abrirApagarMov(id);

    if (acao === 'copiar-csv'){
      var ta = document.getElementById('f-csv');
      if (!ta) return;
      ta.removeAttribute('readonly'); ta.focus(); ta.setSelectionRange(0, ta.value.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      ta.setAttribute('readonly', 'readonly');
      if (ok) toast('Copiado', 'Cole na sua planilha.');
      else if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(function(){ toast('Copiado'); }, function(){});
      return;
    }
    if (acao === 'criar-casa'){
      if (ocupado()) return;
      Promise.all(saboresDaCasa().map(function(s){ return criarSabor(s); })).then(function(){
        toast('Sabores criados', 'Chocolatudo, Kinder, Nutella e Ninho.');
      });
      return;
    }
    if (acao === 'confirmar'){
      var s = acharSabor(kp.id);
      if (!s) return fechar();
      var ajuste = kp.modo === 'ajuste' || kp.modo === 'ajusteAssar';
      var v = kp.txt === '' ? (ajuste ? (kp.modo === 'ajuste' ? nn(s.qtd) : nn(s.crus)) : 0) : parseInt(kp.txt, 10);
      if (!ajuste && !v){ toast('Digite a quantidade'); return; }
      fechar();
      registrar(s, kp.modo, v);
      return;
    }
    if (acao === 'salvar-sabor'){
      if (ocupado()) return;
      var nome = (document.getElementById('f-nome').value || '').trim();
      if (!nome){ toast('Falta o nome do sabor'); return; }
      var preco = lerNumeroBR(document.getElementById('f-preco').value);
      var min = Math.max(0, Math.round(lerNumeroBR(document.getElementById('f-min').value)));
      var corSel = document.querySelector('#f-cores [aria-pressed="true"]');
      var cor = corSel ? corSel.getAttribute('data-cor') : CORES[3];
      fechar();
      if (id){
        atualizarSabor(id, {nome:nome, preco:preco, minimo:min, cor:cor});
        toast('Sabor atualizado', nome);
      } else {
        var idNovo = slug(nome);
        if (acharSabor(idNovo)) idNovo += '-' + novoId().slice(-4);
        var maior = 0;
        S.sabores.forEach(function(x){ maior = Math.max(maior, nn(x.ordem)); });
        criarSabor({id:idNovo, nome:nome, preco:preco, minimo:min, cor:cor, qtd:0, crus:0, ordem:maior + 10});
        toast('Sabor cadastrado', nome);
      }
      return;
    }
    if (acao === 'excluir-sabor'){
      var alvo = acharSabor(id);
      var hx = cabecalho(alvo && alvo.cor, 'Excluir ' + (alvo ? alvo.nome : 'sabor'));
      hx += '<p class="aviso">O sabor sai do estoque e da planilha. Os lançamentos antigos continuam no histórico.</p>';
      hx += '<div class="acoes-sheet"><button class="btn perigo" data-acao="confirmar-excluir-sabor" data-id="' + esc(id) + '" type="button">Excluir</button>'
        + '<button class="btn fantasma" data-acao="fechar" type="button">Manter</button></div>';
      abrir(hx);
      return;
    }
    if (acao === 'confirmar-excluir-sabor'){ if (ocupado()) return; fechar(); removerSabor(id); toast('Sabor excluído'); return; }
    if (acao === 'confirmar-apagar-mov'){
      if (ocupado()) return;
      var mv = null;
      S.movs.forEach(function(x){ if (x.id === id) mv = x; });
      fechar();
      if (!mv) return;
      reverter(mv).then(function(){ return removerMov(id); })
        .then(function(){ toast('Lançamento apagado'); });
      return;
    }
  });

  /* células da planilha */
  document.addEventListener('change', function(e){
    var el = e.target;
    if (!el.classList || !el.classList.contains('cel')) return;
    var id = el.getAttribute('data-id'), campo = el.getAttribute('data-campo');
    var s = acharSabor(id);
    if (!s) return;
    if (ocupado()){ render(); return; }
    var v = lerNumeroBR(el.value);
    if (campo === 'qtd'){
      v = Math.max(0, Math.round(v));
      if (v !== nn(s.qtd)) registrar(s, 'ajuste', v); else render();
    } else if (campo === 'crus'){
      v = Math.max(0, Math.round(v));
      if (v !== nn(s.crus)) registrar(s, 'ajusteAssar', v); else render();
    } else if (campo === 'preco'){
      atualizarSabor(id, {preco:v});
    } else if (campo === 'minimo'){
      atualizarSabor(id, {minimo:Math.max(0, Math.round(v))});
    }
  });

  /* com o app aberto, perceber que passou das 21:10 (ou que virou o dia) */
  var marcoFecho = null, marcoDia = null;
  setInterval(function(){
    var f = jaFechou(), d = hojeISO();
    if (marcoFecho === null){ marcoFecho = f; marcoDia = d; return; }
    if (f !== marcoFecho || d !== marcoDia){
      marcoFecho = f; marcoDia = d;
      render();
    }
  }, 30000);

  window.addEventListener('pagehide', escoar);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) escoar(); });

  /* ============ partida ============ */
  S.trancado = !abertoAgora();
  iniciarLocal();
  pintarTrava();
  render();
  if (S.aguardando) conectarNuvem(); else prepararTrava();
})();
</script>
