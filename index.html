<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Controle de estoque de cookies da Doceria Maria Formiga: quantidade, preco, vendas e historico, direto do celular.">
<meta name="theme-color" content="#EDD9B2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1108" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maria Formiga">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="assets/apple-touch-icon.jpg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.jpg">
<link rel="manifest" href="manifest.webmanifest">
<title>Estoque Maria Formiga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..900,0..100,0..1&family=DM+Sans:opsz,wght@9..40,400..700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* ---------- tokens: claro (mundo creme da marca) ---------- */
:root{
  --bg:#EDD9B2;
  --bg-deep:#E2C99A;
  --surface:#FBF3E4;
  --surface-2:#F4E7CE;
  --ink:#3A1C10;
  --ink-soft:#8A6440;
  --ink-faint:#A9855D;
  --accent:#6E2B1C;
  --accent-2:#8C3A25;
  --on-accent:#FBF3E4;
  --caramel:#A56B3E;
  --line:rgba(110,43,28,.14);
  --line-strong:rgba(110,43,28,.30);
  --ring:rgba(58,28,16,.26);
  --ok:#4F7A45;
  --warn:#A96A12;
  --crit:#AE3527;
  --ok-bg:rgba(79,122,69,.14);
  --warn-bg:rgba(169,106,18,.16);
  --crit-bg:rgba(174,53,39,.13);
  --shadow-sm:0 1px 0 rgba(110,43,28,.05), 0 2px 6px -3px rgba(58,28,16,.30);
  --shadow-md:0 1px 0 rgba(110,43,28,.05), 0 14px 28px -18px rgba(58,28,16,.55);
  --shadow-sheet:0 -18px 44px -18px rgba(41,19,10,.55);
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
  --tap:46px;
  --font-ui:"DM Sans","Helvetica Neue",Arial,sans-serif;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-num:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
/* ---------- tokens: escuro (mundo café) ---------- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1108;
    --bg-deep:#150B05;
    --surface:#2C1A0E;
    --surface-2:#382214;
    --ink:#F4E3C6;
    --ink-soft:#C0996C;
    color-scheme:dark;
  }
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink-faint:#9A7952;
    --accent:#D9954F;
    --accent-2:#E8A863;
    --on-accent:#26150A;
    --caramel:#C98F55;
    --line:rgba(244,227,198,.13);
    --line-strong:rgba(244,227,198,.26);
    --ring:rgba(244,227,198,.30);
    --ok:#83B074;
    --warn:#D9A345;
    --crit:#E0796A;
    --ok-bg:rgba(131,176,116,.16);
    --warn-bg:rgba(217,163,69,.16);
    --crit-bg:rgba(224,121,106,.15);
    --shadow-sm:0 1px 0 rgba(0,0,0,.20), 0 2px 6px -3px rgba(0,0,0,.55);
    --shadow-md:0 1px 0 rgba(0,0,0,.20), 0 14px 30px -18px rgba(0,0,0,.85);
    --shadow-sheet:0 -18px 44px -16px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --bg:#1E1108;
  --bg-deep:#150B05;
  --surface:#2C1A0E;
  --surface-2:#382214;
  --ink:#F4E3C6;
  --ink-soft:#C0996C;
  --ink-faint:#9A7952;
  --accent:#D9954F;
  --accent-2:#E8A863;
  --on-accent:#26150A;
  --caramel:#C98F55;
  --line:rgba(244,227,198,.13);
  --line-strong:rgba(244,227,198,.26);
  --ring:rgba(244,227,198,.30);
  --ok:#83B074;
  --warn:#D9A345;
  --crit:#E0796A;
  --ok-bg:rgba(131,176,116,.16);
  --warn-bg:rgba(217,163,69,.16);
  --crit-bg:rgba(224,121,106,.15);
  --shadow-sm:0 1px 0 rgba(0,0,0,.20), 0 2px 6px -3px rgba(0,0,0,.55);
  --shadow-md:0 1px 0 rgba(0,0,0,.20), 0 14px 30px -18px rgba(0,0,0,.85);
  --shadow-sheet:0 -18px 44px -16px rgba(0,0,0,.75);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
img{max-width:100%}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:16px;
  line-height:1.45;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--caramel);color:var(--surface)}

/* ---------- casca do app ---------- */
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:620px;margin:0 auto;position:relative}

.appbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:12px;
  padding:10px 16px 10px;
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
}
.selo{
  width:44px;height:44px;flex:none;border-radius:50%;
  object-fit:cover;display:block;
  border:1.5px solid var(--line-strong);
  box-shadow:var(--shadow-sm);
  background:var(--surface-2);
}
.marca{display:flex;flex-direction:column;min-width:0;flex:1}
.marca b{
  font-family:var(--font-display);
  font-variation-settings:"SOFT" 60,"WONK" 1,"opsz" 40;
  font-weight:800;font-size:1.16rem;line-height:1.05;letter-spacing:-.01em;
  color:var(--accent);
}
.marca span{
  font-size:.66rem;text-transform:uppercase;letter-spacing:.16em;
  color:var(--ink-faint);font-weight:600;
}
.appbar .totalzinho{text-align:right;line-height:1.05}
.appbar .totalzinho b{
  font-family:var(--font-display);font-variation-settings:"SOFT" 60,"opsz" 60;
  font-weight:800;font-size:1.5rem;display:block;font-variant-numeric:tabular-nums;
}
.appbar .totalzinho span{font-size:.62rem;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-faint);font-weight:600}

main{flex:1;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}

/* ---------- resumo do dia ---------- */
.resumo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tile{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:12px 14px;box-shadow:var(--shadow-sm);
}
.tile em{
  display:block;font-style:normal;font-size:.63rem;text-transform:uppercase;
  letter-spacing:.13em;color:var(--ink-faint);font-weight:700;margin-bottom:2px;
}
.tile b{
  font-family:var(--font-display);font-variation-settings:"SOFT" 60,"opsz" 60;
  font-weight:800;font-size:1.6rem;line-height:1.1;display:block;
  font-variant-numeric:tabular-nums;letter-spacing:-.015em;
}
.tile small{color:var(--ink-soft);font-size:.76rem;font-variant-numeric:tabular-nums}

/* ---------- títulos de seção ---------- */
.secao{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.secao h2{
  margin:0;font-family:var(--font-display);
  font-variation-settings:"SOFT" 55,"opsz" 30;font-weight:700;
  font-size:1.02rem;letter-spacing:-.005em;
}
.secao .dica{font-size:.74rem;color:var(--ink-faint)}

/* ---------- cartão de sabor ---------- */
.sabores{display:flex;flex-direction:column;gap:10px}
.sabor{
  position:relative;display:grid;
  grid-template-columns:auto minmax(0,1fr);
  grid-template-areas:"chip nome" "chip meta" "cont cont" "acoes acoes";
  align-items:center;column-gap:11px;row-gap:1px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:11px 11px 11px 13px;
  box-shadow:var(--shadow-sm);
  transition:box-shadow .25s ease, border-color .25s ease;
}
.sabor.pulso{border-color:var(--caramel);box-shadow:var(--shadow-md),0 0 0 3px var(--warn-bg)}
.sabor .chip{
  grid-area:chip;width:36px;height:36px;border-radius:12px;
  box-shadow:inset 0 0 0 1.5px var(--ring), inset 0 -7px 11px -6px rgba(0,0,0,.45);
}
.sabor .nome{
  grid-area:nome;align-self:end;
  font-family:var(--font-display);font-variation-settings:"SOFT" 55,"opsz" 30;
  font-weight:700;font-size:1.05rem;line-height:1.2;letter-spacing:-.005em;
  margin:0;display:flex;align-items:center;gap:7px;min-width:0;
}
.sabor .nome span.pill{flex:none}
.sabor .meta{
  grid-area:meta;align-self:start;margin:0;
  font-size:.755rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;
}
.sabor .meta .sep{color:var(--ink-faint)}
.editar{
  font-size:.7rem;font-weight:700;color:var(--caramel);
  text-decoration:underline;text-decoration-style:dotted;
  text-decoration-color:var(--line-strong);text-underline-offset:3px;
}

.pill{
  display:inline-flex;align-items:center;gap:4px;
  font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  padding:3px 7px;border-radius:var(--r-pill);white-space:nowrap;
}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}

/* contadores: o que esta pronto e o que esta cru */
.contadores{grid-area:cont;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.cont{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:8px 6px 7px;border-radius:14px;
  background:var(--surface-2);border:1px solid var(--line);
  transition:background .15s ease, transform .1s ease, border-color .15s ease;
}
.cont:active{transform:scale(.97);background:var(--bg-deep)}
.cont em{
  font-style:normal;font-size:.58rem;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-faint);
}
.cont b{
  font-family:var(--font-display);font-variation-settings:"SOFT" 60,"opsz" 72;
  font-weight:800;font-size:1.95rem;line-height:1.02;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em;
}
.cont.zero b{color:var(--ink-faint)}
.cont .cap{min-height:1.05em;font-size:.63rem;font-weight:700;color:var(--caramel);line-height:1.05}
.cont.assar{border-style:dashed}
.cont.assar b{color:var(--caramel)}
/* o "pra assar" e painel de leitura: quem mexe nele e a planilha */
.cont.estatico{background:transparent}
.cont.estatico:active{transform:none;background:transparent}
.cont.estatico .cap{color:var(--ink-faint);font-weight:600}

.acoes-sabor{
  grid-area:acoes;display:flex;gap:8px;margin-top:10px;
  padding-top:10px;border-top:1px dashed var(--line);
}
.btn-linha{
  flex:1;min-height:44px;border-radius:13px;
  border:1px solid var(--line);background:var(--surface-2);
  font-size:.78rem;font-weight:700;color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .09s ease, background .15s ease;
}
.btn-linha:active{transform:scale(.97);background:var(--bg-deep)}
.btn-linha.venda{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn-linha.venda:active{background:var(--accent-2)}

/* ---------- planilha ---------- */
.tabela-wrap{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow-sm);overflow-x:auto;-webkit-overflow-scrolling:touch;
}
table{border-collapse:collapse;width:100%;min-width:430px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{
  font-size:.61rem;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-faint);
  font-weight:700;background:var(--surface-2);position:sticky;top:0;
}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
th:first-child{background:var(--surface-2);z-index:2}
tbody tr:last-child td{border-bottom:0}
td.nomecel{font-weight:600}
td.nomecel .ponto{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;box-shadow:inset 0 0 0 1.5px var(--ring);vertical-align:baseline}
td.nomecel .editar{color:var(--ink);font-size:.88rem}
.cel{
  width:66px;padding:7px 8px;border:1px solid transparent;border-radius:9px;
  background:var(--surface-2);text-align:right;
  font-family:var(--font-num);font-size:15px;font-weight:500;
  font-variant-numeric:tabular-nums;
}
.cel:focus{border-color:var(--accent);background:var(--surface);outline:none}
tfoot td{
  font-weight:700;background:var(--surface-2);border-top:1.5px solid var(--line-strong);
  font-variant-numeric:tabular-nums;
}
tfoot td:first-child{background:var(--surface-2)}
.valorcel{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* ---------- histórico ---------- */
.faixa{
  display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:16px;
}
.faixa > div{padding:10px 6px;text-align:center;border-right:1px solid var(--line)}
.faixa > div:last-child{border-right:0}
.faixa em{
  display:block;font-style:normal;font-size:.57rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.11em;color:var(--ink-faint);
}
.faixa b{
  display:block;font-family:var(--font-display);
  font-variation-settings:"SOFT" 60,"opsz" 48;font-weight:800;
  font-size:1.45rem;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.faixa small{display:block;font-size:.69rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* fechamento do dia: o relatório de como foi o dia */
.fecho{
  background:var(--surface);border:1px solid var(--line);
  border-top:3px solid var(--accent);
  border-radius:var(--r-lg);padding:13px 14px 12px;
  box-shadow:var(--shadow-md);margin-bottom:16px;
}
.fecho-topo{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fecho-topo em{
  font-style:normal;font-size:.6rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.13em;color:var(--ink-faint);
}
.fecho .estado{
  font-size:.62rem;font-weight:700;padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap;
}
.fecho .estado.aberto{background:var(--warn-bg);color:var(--warn)}
.fecho .estado.fechado{background:var(--ok-bg);color:var(--ok)}
.fecho h3{
  margin:3px 0 12px;font-family:var(--font-display);
  font-variation-settings:"SOFT" 55,"opsz" 30;font-weight:700;
  font-size:1.02rem;line-height:1.2;
}
.fecho-nums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.fecho-nums > div{
  background:var(--surface-2);border-radius:var(--r-md);
  padding:9px 11px;border:1px solid var(--line);
}
.fecho-nums b{
  display:block;font-family:var(--font-display);
  font-variation-settings:"SOFT" 60,"opsz" 60;font-weight:800;
  font-size:1.55rem;line-height:1.12;font-variant-numeric:tabular-nums;letter-spacing:-.025em;
}
.fecho-nums em{
  font-style:normal;font-size:.6rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.11em;color:var(--ink-faint);
}
.comp{
  display:flex;flex-direction:column;gap:6px;
  padding:11px 0;margin-bottom:11px;
  border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);
}
.comp .l{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline;font-size:.79rem}
.comp .l span{color:var(--ink-soft)}
.comp .l b{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.comp .l b.sobe{color:var(--ok)}
.comp .l b.desce{color:var(--crit)}
.btn.planilha-dia{
  width:100%;margin-top:12px;gap:8px;
  background:var(--accent);color:var(--on-accent);
}
.btn.planilha-dia svg{
  width:17px;height:17px;flex:none;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
}
.btn.planilha-dia.fina{
  background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
  min-height:40px;font-size:.82rem;margin-top:10px;
}
.btn.planilha-dia.fina:active{background:var(--bg-deep)}
.sem-mov{margin:0;font-size:.82rem;color:var(--ink-faint);text-align:center;padding:6px 0 2px}
.alerta{
  display:flex;gap:7px;align-items:baseline;
  margin-top:11px;padding:9px 11px;border-radius:12px;
  background:var(--warn-bg);color:var(--warn);
  font-size:.77rem;font-weight:600;line-height:1.35;
}
.alerta b{flex:none;font-weight:800}

.dia{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:11px 12px;box-shadow:var(--shadow-sm);margin-bottom:10px;
}
.dia-cab{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:0 0 8px;margin-bottom:9px;border-bottom:1px solid var(--line);
}
.dia-cab b{
  font-family:var(--font-display);font-variation-settings:"SOFT" 55,"opsz" 24;
  font-weight:700;font-size:.95rem;
}
.dia-cab span{font-size:.74rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
/* fechamento do dia, sabor por sabor */
.dia-sabores{display:flex;flex-direction:column;gap:7px}
.ds{
  display:grid;grid-template-columns:minmax(0,1fr) auto auto;
  align-items:baseline;gap:9px;font-size:.84rem;
}
.ds .nm{min-width:0;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-weight:600}
.ds .ponto{
  width:9px;height:9px;border-radius:3px;flex:none;
  box-shadow:inset 0 0 0 1.5px var(--ring);align-self:center;
}
.ds .ex{font-style:normal;font-size:.71rem;font-weight:500;color:var(--ink-faint)}
.ds > b{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.ds > i{
  font-style:normal;color:var(--ink-soft);font-variant-numeric:tabular-nums;
  min-width:76px;text-align:right;white-space:nowrap;
}
.ver-lanc{
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
  min-height:38px;margin-top:9px;border-top:1px dashed var(--line);
  font-size:.75rem;font-weight:700;color:var(--caramel);
}
.ver-lanc .seta{font-size:.7rem}
.lancs{margin-top:2px}

.mov{
  display:grid;grid-template-columns:46px 1fr auto auto;
  align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);
}
.lancs .mov:last-child{border-bottom:0;padding-bottom:0}
.mov .hora{font-family:var(--font-num);font-size:.76rem;color:var(--ink-faint)}
.mov .oq{min-width:0}
.mov .oq b{display:block;font-size:.9rem;font-weight:600;line-height:1.2}
.mov .oq span{font-size:.72rem;color:var(--ink-soft)}
.mov .delta{
  font-family:var(--font-num);font-weight:500;font-size:.95rem;
  font-variant-numeric:tabular-nums;
}
.mov .delta.mais{color:var(--ok)}
.mov .delta.menos{color:var(--crit)}
.mov .delta.trans{color:var(--caramel)}
.mov .apagar{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  color:var(--ink-faint);border:1px solid transparent;
}
.mov .apagar:active{background:var(--crit-bg);color:var(--crit)}
.mov .apagar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* ---------- vazio / rodapé ---------- */
.vazio{
  text-align:center;padding:34px 20px;border:1.5px dashed var(--line-strong);
  border-radius:var(--r-lg);background:var(--surface-2);
  background:color-mix(in srgb, var(--surface) 55%, transparent);
}
.vazio p{margin:0 0 4px;font-family:var(--font-display);font-variation-settings:"SOFT" 55;font-weight:700;font-size:1rem}
.vazio small{color:var(--ink-soft);display:block;max-width:34ch;margin:0 auto 14px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:var(--tap);padding:0 18px;border-radius:14px;
  background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.92rem;
  transition:transform .09s ease, background .15s ease;
}
.btn:active{transform:scale(.97);background:var(--accent-2)}
.btn.fantasma{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.fantasma:active{background:var(--bg-deep)}
.btn.perigo{background:var(--crit-bg);color:var(--crit);border:1px solid transparent}
.btn.full{width:100%}
.btn.zerar{
  margin-top:20px;font-size:.82rem;font-weight:600;
  color:var(--ink-soft);background:transparent;border:1px dashed var(--line-strong);
}
.btn.zerar:active{background:var(--crit-bg);color:var(--crit)}
.aviso b{color:var(--ink);font-weight:700}
.rodape{
  margin-top:26px;text-align:center;font-size:.7rem;color:var(--ink-faint);
  display:flex;flex-direction:column;gap:4px;align-items:center;
}
.rodape .sync{display:inline-flex;align-items:center;gap:6px}
.rodape .bolinha{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.rodape .bolinha.local{background:var(--warn)}

/* ---------- abas ---------- */
.abas{
  position:fixed;bottom:0;left:0;right:0;z-index:45;
  display:flex;justify-content:center;gap:2px;
  padding:6px 10px calc(6px + env(safe-area-inset-bottom));
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-top:1px solid var(--line);
}
.abas .in{display:flex;gap:2px;width:100%;max-width:620px}
.abas button{
  position:relative;
  flex:1;min-height:52px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-faint);font-size:.66rem;font-weight:700;
  letter-spacing:.03em;transition:color .18s ease, background .18s ease;
}
.abas button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.abas button[aria-selected="true"]{color:var(--accent);background:var(--surface)}
.abas .badge{
  position:absolute;top:8px;left:calc(50% + 9px);
  width:8px;height:8px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 2px var(--bg);
}
.abas button:active{background:var(--surface-2)}

/* ---------- bottom sheet ---------- */
.backdrop{
  position:fixed;inset:0;z-index:60;background:rgba(41,19,10,.55);
  opacity:0;pointer-events:none;transition:opacity .22s ease;
  backdrop-filter:blur(2px);
}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  max-height:92vh;
  max-width:620px;margin:0 auto;
  background:var(--surface);
  border-radius:26px 26px 0 0;
  border-top:1px solid var(--line);
  box-shadow:var(--shadow-sheet);
  padding:8px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .3s cubic-bezier(.32,.8,.3,1);
  max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.sheet.on{transform:translateY(0)}
.puxador{width:42px;height:4.5px;border-radius:99px;background:var(--line-strong);margin:4px auto 12px}
.sheet-cab{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.sheet-cab .chip{width:32px;height:32px;border-radius:10px;flex:none;box-shadow:inset 0 0 0 1.5px var(--ring)}
.sheet-cab h3{
  margin:0;font-family:var(--font-display);font-variation-settings:"SOFT" 55,"opsz" 40;
  font-weight:800;font-size:1.2rem;line-height:1.1;flex:1;
}
.sheet-cab .fechar{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-soft);font-size:1.15rem;line-height:1}

.modos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-2);padding:5px;border-radius:15px;margin-bottom:14px}
.modos button{
  min-height:42px;border-radius:11px;font-size:.8rem;font-weight:700;color:var(--ink-soft);
  display:flex;flex-direction:column;gap:1px;align-items:center;justify-content:center;line-height:1.15;
}
.modos button small{font-size:.6rem;font-weight:600;opacity:.8}
.modos button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-sm)}

.visor{
  text-align:center;padding:6px 0 12px;
}
.visor .num{
  font-family:var(--font-display);font-variation-settings:"SOFT" 60,"opsz" 96;
  font-weight:800;font-size:3.1rem;line-height:1;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.visor .num.vazio-num{color:var(--ink-faint)}
.visor .previa{font-size:.82rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;margin-top:6px;min-height:1.2em}
.visor .previa b{color:var(--ink);font-weight:700}

.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.teclado button{
  min-height:52px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line);
  font-family:var(--font-display);font-variation-settings:"SOFT" 60,"opsz" 40;
  font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;
  transition:transform .07s ease, background .12s ease;
}
.teclado button:active{transform:scale(.94);background:var(--bg-deep)}
.teclado button.aux{font-family:var(--font-ui);font-size:.95rem;font-weight:700;color:var(--ink-soft)}
.teclado button.aux svg{width:24px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.campo{display:block;margin-bottom:13px}
.campo span{
  display:block;font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;
  font-weight:700;color:var(--ink-faint);margin-bottom:5px;
}
.campo input{
  width:100%;min-height:48px;padding:0 14px;border-radius:13px;
  background:var(--surface-2);border:1px solid var(--line);
  font-size:16px;font-weight:600;
}
.campo input:focus{border-color:var(--accent);background:var(--surface);outline:none}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cores{display:flex;gap:9px;flex-wrap:wrap}
.cores button{
  width:38px;height:38px;border-radius:12px;
  box-shadow:inset 0 0 0 1.5px var(--ring);
}
.cores button[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--ring),0 0 0 3px var(--accent)}
.acoes-sheet{display:flex;gap:9px;margin-top:6px}
.acoes-sheet .btn{flex:1}
.csv{
  width:100%;min-height:190px;border-radius:13px;padding:12px;
  background:var(--surface-2);border:1px solid var(--line);
  font-family:var(--font-num);font-size:13px;line-height:1.6;resize:vertical;
}
.aviso{font-size:.76rem;color:var(--ink-soft);margin:0 0 12px}

/* ---------- trava de acesso ---------- */
body.trancado .app,body.trancado .abas{visibility:hidden}
.trava{
  position:fixed;inset:0;z-index:90;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:26px 22px calc(26px + env(safe-area-inset-bottom));
  text-align:center;overflow-y:auto;
}
.trava .selo-grande{
  width:96px;height:96px;border-radius:50%;object-fit:cover;
  border:2px solid var(--line-strong);box-shadow:var(--shadow-md);margin-bottom:16px;
}
.trava h1{
  margin:0;font-family:var(--font-display);
  font-variation-settings:"SOFT" 60,"WONK" 1,"opsz" 60;
  font-weight:800;font-size:1.5rem;line-height:1.1;letter-spacing:-.015em;color:var(--accent);
}
.trava .ajuda{margin:5px 0 0;font-size:.85rem;color:var(--ink-soft);min-height:2.6em;max-width:26ch}
.trava .ajuda.erro{color:var(--crit);font-weight:600}
.pontos{display:flex;gap:13px;margin:19px 0 21px}
.pontos i{
  width:14px;height:14px;border-radius:50%;
  border:1.5px solid var(--line-strong);background:transparent;
  transition:background .14s ease, transform .14s ease, border-color .14s ease;
}
.pontos i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.14)}
.trava .teclado{width:100%;max-width:300px;margin-bottom:4px}
.trava .rodape{margin-top:18px}
@keyframes tremer{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}40%{transform:translateX(7px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(3px)}
}
.tremendo{animation:tremer .42s ease}
.btn.destrancar{
  margin-top:4px;background:transparent;color:var(--ink-faint);
  font-size:.76rem;font-weight:600;min-height:38px;padding:0 10px;
}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));
  z-index:70;max-width:596px;margin:0 auto;
  display:flex;align-items:center;gap:12px;
  padding:11px 12px 11px 15px;border-radius:16px;
  background:var(--ink);color:var(--bg);
  box-shadow:var(--shadow-md);
  transform:translateY(140%);opacity:0;pointer-events:none;
  transition:transform .28s cubic-bezier(.32,.8,.3,1), opacity .2s ease;
}
.toast.on{transform:translateY(0);opacity:1;pointer-events:auto}
.toast p{margin:0;flex:1;font-size:.85rem;font-weight:600;line-height:1.3}
.toast p small{display:block;font-weight:500;opacity:.72;font-size:.76rem}
.toast button{
  flex:none;min-height:38px;padding:0 14px;border-radius:11px;
  background:rgba(255,255,255,.20);
  background:color-mix(in srgb, var(--bg) 22%, transparent);
  color:var(--bg);font-weight:700;font-size:.82rem;
}
.toast button:active{background:color-mix(in srgb, var(--bg) 34%, transparent)}

@keyframes surge{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.painel{animation:surge .26s ease both}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
  .sheet{transition:none}
}
</style>
</head>
<body>
<div class="trava" id="trava" hidden></div>

<div class="app">
  <header class="appbar">
    <img class="selo" src="assets/logo-mark.jpg" alt="Doceria Maria Formiga" width="44" height="44">
    <div class="marca">
      <b>Maria Formiga</b>
      <span>Controle de cookies</span>
    </div>
    <div class="totalzinho">
      <b id="barra-total">0</b>
      <span id="barra-rotulo">pra vender</span>
    </div>
  </header>

  <main id="view"></main>

  <nav class="abas" role="tablist" aria-label="Seções do controle">
    <div class="in">
      <button role="tab" id="aba-estoque" data-aba="estoque" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><circle cx="9.2" cy="9.6" r="1.15" fill="currentColor" stroke="none"/><circle cx="14.8" cy="11" r="1.15" fill="currentColor" stroke="none"/><circle cx="10.4" cy="15" r="1.15" fill="currentColor" stroke="none"/><circle cx="15" cy="15.6" r="1" fill="currentColor" stroke="none"/></svg>
        Estoque
      </button>
      <button role="tab" id="aba-planilha" data-aba="planilha" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="4.2" width="17.6" height="15.6" rx="2.4"/><path d="M3.2 9.4h17.6M9.4 9.4v10.4M15 9.4v10.4"/></svg>
        Planilha
      </button>
      <button role="tab" id="aba-historico" data-aba="historico" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.4v4.9l3.5 2.1"/></svg>
        Histórico
      </button>
    </div>
  </nav>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Painel de ação"></div>
<div class="toast" id="toast" role="status" aria-live="polite">
  <p id="toast-txt"></p>
  <button id="toast-btn" type="button">Desfazer</button>
</div>

<script>
(function(){
  'use strict';

  /* ============ formatos ============ */
  var BRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
  var DIA = new Intl.DateTimeFormat('pt-BR', {weekday:'long', day:'2-digit', month:'long'});
  var HORA = new Intl.DateTimeFormat('pt-BR', {hour:'2-digit', minute:'2-digit'});
  function moeda(v){ return BRL.format(Number(v) || 0); }
  function nn(v){ var n = Number(v); return isFinite(n) ? n : 0; }
  function maiusc1(t){ t = String(t); return t.charAt(0).toUpperCase() + t.slice(1); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function precoBR(v){ return nn(v).toFixed(2).replace('.', ','); }
  function lerNumeroBR(s){
    var t = String(s == null ? '' : s).replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.');
    var n = parseFloat(t); return isFinite(n) ? n : 0;
  }
  function novoId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function slug(s){
    var base = String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
    return base || ('sabor-' + novoId());
  }
  function clone(o){ var n = {}, k; for (k in o) if (Object.prototype.hasOwnProperty.call(o, k)) n[k] = o[k]; return n; }

  /* ============ sabores da casa ============ */
  var CORES = ['#4C2212', '#6E2B1C', '#7B3F1D', '#A56B3E', '#C08A4A', '#D8C69B'];
  var DA_CASA = [
    {nome:'Chocolatudo', cor:'#4C2212'},
    {nome:'Kinder',      cor:'#C08A4A'},
    {nome:'Nutella',     cor:'#7B3F1D'},
    {nome:'Ninho',       cor:'#D8C69B'}
  ];
  function saboresDaCasa(){
    return DA_CASA.map(function(s, i){
      return {id:slug(s.nome), nome:s.nome, cor:s.cor, qtd:0, crus:0, preco:12, minimo:6, ordem:(i + 1) * 10};
    });
  }

  /* ============ estado ============ */
  var S = {
    sabores:[], movs:[], aba:'estoque', db:null, fonte:'local', prontoNuvem:false,
    aguardando:!!(window.claude && typeof window.claude.use === 'function'),
    trancado:true, travaPronta:false
  };
  var CHAVE = 'mf.cookies.v1', CHAVE_SENHA = 'mf.senha.v1', CHAVE_ABERTO = 'mf.aberto.v1';
  var JANELA = 12 * 60 * 60 * 1000;
  var sujo = false, ultimoMov = null, tToast = null;
  var diasAbertos = {};

  function ordenar(){ S.sabores.sort(function(a, b){ return nn(a.ordem) - nn(b.ordem); }); }
  function corpo(s){
    return {nome:s.nome, cor:s.cor, qtd:nn(s.qtd), crus:nn(s.crus),
            preco:nn(s.preco), minimo:nn(s.minimo), ordem:nn(s.ordem)};
  }
  function acharSabor(id){
    for (var i = 0; i < S.sabores.length; i++) if (S.sabores[i].id === id) return S.sabores[i];
    return null;
  }

  /* ============ guarda local (aparelho) ============ */
  function lerLocal(){
    try { return JSON.parse(localStorage.getItem(CHAVE)); } catch (e) { return null; }
  }
  function salvarLocal(){
    if (S.db) return;
    try { localStorage.setItem(CHAVE, JSON.stringify({sabores:S.sabores, movs:S.movs.slice(0, 400)})); } catch (e) {}
  }
  function iniciarLocal(){
    var d = lerLocal();
    if (d && d.sabores && d.sabores.length){ S.sabores = d.sabores; S.movs = d.movs || []; }
    else { S.sabores = saboresDaCasa(); S.movs = []; salvarLocal(); }
    ordenar();
  }

  /* ============ guarda na nuvem ============ */
  function ocupado(){
    if (!S.aguardando) return false;
    toast('Só um instante', 'Conectando com seus dados salvos…');
    return true;
  }
  function conectarNuvem(){
    if (!window.claude || typeof window.claude.use !== 'function') return;
    setTimeout(function(){ if (S.aguardando){ S.aguardando = false; prepararTrava(); render(); } }, 11000);
    window.claude.use('db').then(function(db){
      S.aguardando = false;
      if (!db){ prepararTrava(); render(); return; }
      S.db = db;
      S.fonte = 'nuvem';
      prepararTrava();
      /* data() vem congelado — copiar antes de anexar o id */
      db.collection('estoque').orderBy('ordem').onSnapshot(function(snap){
        S.sabores = snap.docs.map(function(d){
          var o = clone(d.data() || {}); o.id = d.id; return o;
        });
        S.prontoNuvem = true;
        render();
      }, function(){ S.db = null; S.fonte = 'local'; iniciarLocal(); render(); });
      db.collection('movimentos').orderBy('ts', 'desc').limit(300).onSnapshot(function(snap){
        S.movs = snap.docs.map(function(d){
          var o = clone(d.data() || {}); o.id = d.id; return o;
        });
        render();
      }, function(){});
    }).catch(function(){ S.aguardando = false; prepararTrava(); render(); });
  }

  /* ============ gravações ============ */
  function erro(e){
    var c = e && e.code;
    if (c === 'quota_exceeded') toast('Histórico cheio', 'Apague registros antigos na aba Histórico.');
    else toast('Não deu para salvar', 'Tente de novo em alguns segundos.');
  }
  function atualizarSabor(id, patch){
    if (S.db) return S.db.doc('estoque/' + id).update(patch).catch(erro);
    var s = acharSabor(id);
    if (s){ for (var k in patch) s[k] = patch[k]; ordenar(); salvarLocal(); render(); }
    return Promise.resolve();
  }
  function criarSabor(s){
    if (S.db) return S.db.doc('estoque/' + s.id).set(corpo(s)).catch(erro);
    S.sabores.push(s); ordenar(); salvarLocal(); render();
    return Promise.resolve();
  }
  function removerSabor(id){
    if (S.db) return S.db.doc('estoque/' + id).delete().catch(erro);
    S.sabores = S.sabores.filter(function(s){ return s.id !== id; });
    salvarLocal(); render();
    return Promise.resolve();
  }
  function gravarMov(m){
    if (S.db){
      var b = clone(m); delete b.id;
      return S.db.doc('movimentos/' + m.id).set(b).catch(erro);
    }
    S.movs.unshift(m); S.movs = S.movs.slice(0, 400); salvarLocal(); render();
    return Promise.resolve();
  }
  function removerMov(id){
    if (S.db) return S.db.doc('movimentos/' + id).delete().catch(erro);
    S.movs = S.movs.filter(function(m){ return m.id !== id; });
    salvarLocal(); render();
    return Promise.resolve();
  }

  /* ============ lançamentos ============ */
  var ROTULO = {
    venda:'Venda', assar:'Assado', massa:'Massa nova',
    ajuste:'Contagem ajustada', ajusteAssar:'Contagem da massa'
  };
  var TITULO_BOTAO = {
    venda:'Registrar venda', assar:'Saiu do forno', massa:'Registrar massa',
    ajuste:'Salvar contagem', ajusteAssar:'Salvar contagem'
  };

  function detalheMov(m){
    if (m.tipo === 'venda') return moeda(m.valor);
    if (m.tipo === 'assar') return 'Pra assar ' + m.antesAssar + ' → ' + m.depoisAssar
      + ' · pra vender ' + m.antesVender + ' → ' + m.depoisVender;
    if (m.tipo === 'massa' || m.tipo === 'ajusteAssar') return 'Pra assar ' + m.antesAssar + ' → ' + m.depoisAssar;
    return 'Pra vender ' + m.antesVender + ' → ' + m.depoisVender;
  }

  function registrar(sabor, tipo, valorDigitado){
    if (ocupado()) return Promise.resolve();
    var v = Math.max(0, Math.round(nn(valorDigitado)));
    var aV = nn(sabor.qtd), aA = nn(sabor.crus);
    var dV = aV, dA = aA;
    if (tipo === 'venda') dV = Math.max(0, aV - v);
    else if (tipo === 'massa') dA = aA + v;
    else if (tipo === 'assar'){ dA = Math.max(0, aA - v); dV = aV + v; }
    else if (tipo === 'ajuste') dV = v;
    else if (tipo === 'ajusteAssar') dA = v;

    var deltaV = dV - aV, deltaA = dA - aA;
    if (!deltaV && !deltaA){ pulsar(sabor.id); return Promise.resolve(); }

    var preco = nn(sabor.preco);
    var m = {
      id:novoId(), tipo:tipo, saborId:sabor.id, sabor:sabor.nome, cor:sabor.cor,
      qtd:Math.abs(deltaV || deltaA),
      dVender:deltaV, dAssar:deltaA, preco:preco,
      valor:(tipo === 'venda' ? Math.abs(deltaV) * preco : 0),
      antesVender:aV, depoisVender:dV, antesAssar:aA, depoisAssar:dA,
      dia:hojeISO(), ts:new Date().toISOString()
    };
    var patch = {};
    if (deltaV) patch.qtd = dV;
    if (deltaA) patch.crus = dA;

    return atualizarSabor(sabor.id, patch).then(function(){
      return gravarMov(m);
    }).then(function(){
      pulsar(sabor.id);
      ultimoMov = m;
      toast(ROTULO[tipo] + ' · ' + m.qtd + ' ' + m.sabor, detalheMov(m), true);
    });
  }

  function desfazer(){
    if (!ultimoMov) return;
    var m = ultimoMov; ultimoMov = null;
    esconderToast();
    atualizarSabor(m.saborId, {qtd:nn(m.antesVender), crus:nn(m.antesAssar)}).then(function(){
      return removerMov(m.id);
    }).then(function(){ toast('Desfeito', m.sabor + ' voltou para ' + nn(m.antesVender) + ' pra vender.'); });
  }

  /* toques repetidos em "Vendi 1" viram um único lançamento */
  var fila = null;
  function vender1(sabor){
    if (ocupado()) return;
    if (qtdNaTela(sabor) <= 0){
      toast('Nada pronto', sabor.nome + ' não tem nenhum pra vender' + (nn(sabor.crus) ? ' — tem ' + nn(sabor.crus) + ' pra assar.' : '.'));
      return;
    }
    if (fila && fila.id !== sabor.id) escoar();
    if (!fila) fila = {id:sabor.id, qtd:0, timer:null};
    fila.qtd += 1;
    clearTimeout(fila.timer);
    fila.timer = setTimeout(escoar, 700);
    pintarCartao(sabor.id);
  }
  function escoar(){
    if (!fila) return;
    var f = fila; fila = null;
    clearTimeout(f.timer);
    var s = acharSabor(f.id);
    if (s && f.qtd > 0) registrar(s, 'venda', f.qtd); else pintarCartao(f.id);
  }
  function deltaFila(id){ return (fila && fila.id === id) ? -fila.qtd : 0; }
  function qtdNaTela(s){ return Math.max(0, nn(s.qtd) + deltaFila(s.id)); }

  /* ============ toast ============ */
  var elToast = document.getElementById('toast');
  var elToastTxt = document.getElementById('toast-txt');
  var elToastBtn = document.getElementById('toast-btn');
  function toast(titulo, detalhe, comDesfazer){
    elToastTxt.innerHTML = esc(titulo) + (detalhe ? '<small>' + esc(detalhe) + '</small>' : '');
    elToastBtn.hidden = !comDesfazer;
    elToast.classList.add('on');
    clearTimeout(tToast);
    tToast = setTimeout(esconderToast, comDesfazer ? 5200 : 2800);
  }
  function esconderToast(){ elToast.classList.remove('on'); clearTimeout(tToast); }

  function pulsar(id){
    var el = document.querySelector('[data-cartao="' + id + '"]');

  /* ============ contas ============ */
  function totais(){
    var t = {vender:0, assar:0, valor:0, baixos:0};
    S.sabores.forEach(function(s){
      var q = qtdNaTela(s), c = nn(s.crus);
      t.vender += q; t.assar += c; t.valor += q * nn(s.preco);
      if (q <= nn(s.minimo)) t.baixos++;
    });
    return t;
  }
  function hojeISO(){ return diaISO(new Date()); }
  function doDia(dia){
    var r = {vendidos:0, faturamento:0, assados:0};
    S.movs.forEach(function(m){
      if (diaDe(m) !== dia) return;
      if (m.tipo === 'venda'){ r.vendidos += nn(m.qtd); r.faturamento += nn(m.valor); }
      if (m.tipo === 'assar') r.assados += nn(m.qtd);
    });
    return r;
  }
  function diaISO(d){
    var p = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  /* o dia do lançamento é o dia de quem vendeu, não o de Greenwich: às 21h no
     Brasil o ts em UTC já virou amanhã. Registros antigos caem no ts. */
  function diaDe(m){ return m.dia || diaISO(new Date(m.ts)); }
  function somaDesde(dias){
    var lim = new Date(); lim.setHours(0, 0, 0, 0);
    lim.setDate(lim.getDate() - (dias - 1));
    var corte = diaISO(lim), r = {vendidos:0, faturamento:0};
    S.movs.forEach(function(m){
      if (m.tipo !== 'venda' || diaDe(m) < corte) return;
      r.vendidos += nn(m.qtd); r.faturamento += nn(m.valor);
    });
    return r;
  }
  function somaMes(){
    var pref = hojeISO().slice(0, 7), r = {vendidos:0, faturamento:0};
    S.movs.forEach(function(m){
      if (m.tipo !== 'venda' || diaDe(m).slice(0, 7) !== pref) return;
      r.vendidos += nn(m.qtd); r.faturamento += nn(m.valor);
    });
    return r;
  }
  /* fechamento de um dia: o que cada sabor fez, do que mais vendeu pro que menos */
  function fechamento(dia){
    var por = {}, ordem = [], tot = {vendidos:0, faturamento:0, ajustes:0, lancamentos:0};
    S.movs.forEach(function(m){
      if (diaDe(m) !== dia) return;
      var k = m.saborId || m.sabor;
      if (!por[k]){
        por[k] = {nome:m.sabor, cor:m.cor, vendidos:0, faturamento:0, ajustes:0, fornos:0};
        ordem.push(k);
      }
      var x = por[k];
      tot.lancamentos++;
      if (m.tipo === 'venda'){
        x.vendidos += nn(m.qtd); x.faturamento += nn(m.valor);
        tot.vendidos += nn(m.qtd); tot.faturamento += nn(m.valor);
      } else if (m.tipo === 'assar' || m.tipo === 'massa'){
        x.fornos += nn(m.qtd);
      } else { x.ajustes++; tot.ajustes++; }
    });
    ordem.sort(function(a, b){
      return (por[b].faturamento - por[a].faturamento) || (por[b].vendidos - por[a].vendidos);
    });
    return {tot:tot, ordem:ordem, por:por};
  }

  /* o dia comercial fecha as 21:10 */
  var FECHA_H = 21, FECHA_M = 10;
  function horaFecho(){ return (FECHA_H < 10 ? '0' : '') + FECHA_H + ':' + (FECHA_M < 10 ? '0' : '') + FECHA_M; }
  function jaFechou(){
    var d = new Date();
    return d.getHours() > FECHA_H || (d.getHours() === FECHA_H && d.getMinutes() >= FECHA_M);
  }
  function diaMenos(n){
    var d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - n);
    return diaISO(d);
  }
  /* média por dia dos n dias anteriores a hoje */
  function mediaAnterior(n){
    var hoje = hojeISO(), corte = diaMenos(n), t = {vendidos:0, faturamento:0, temDados:false};
    S.movs.forEach(function(m){
      if (m.tipo !== 'venda') return;
      var d = diaDe(m);
      if (d >= hoje || d < corte) return;
      t.vendidos += nn(m.qtd); t.faturamento += nn(m.valor); t.temDados = true;
    });
    t.vendidos = t.vendidos / n; t.faturamento = t.faturamento / n;
    return t;
  }
  function precisamAtencao(){
    var lista = [];
    S.sabores.forEach(function(s){
      var q = nn(s.qtd), c = nn(s.crus), min = nn(s.minimo);
      if (q <= 0 && c > 0) lista.push(s.nome + ' zerado, ' + c + ' pra assar');
      else if (q <= 0) lista.push(s.nome + ' zerado');
      else if (min > 0 && q <= min) lista.push(s.nome + ' com ' + q + ' (mínimo ' + min + ')');
    });
    return lista;
  }

  function situacao(s){
    var q = qtdNaTela(s), c = nn(s.crus), min = nn(s.minimo);
    if (q <= 0 && c > 0) return {cls:'warn', txt:'Precisa assar'};
    if (q <= 0) return {cls:'crit', txt:'Acabou'};
    if (min > 0 && q <= min) return {cls:'warn', txt:'Acabando'};
    return {cls:'ok', txt:'Ok'};
  }

  var ICO_APAGA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 5h11.4a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H8.6L2.6 12z"/><path d="M12.4 9.4l5.2 5.2M17.6 9.4l-5.2 5.2"/></svg>';

  /* ============ tela: histórico ============ */
  function movDelta(m){
    var dV = (m.dVender == null ? nn(m.delta) : nn(m.dVender)), dA = nn(m.dAssar);
    if (m.tipo === 'assar') return {cls:'trans', txt:'⇢ ' + Math.abs(dV)};

  function linhaComp(rotulo, valor, classe){
    return '<div class="l"><span>' + esc(rotulo) + '</span><b' + (classe ? ' class="' + classe + '"' : '') + '>'
      + valor + '</b></div>';

  function blocoFechamento(){
    var hoje = hojeISO(), f = fechamento(hoje), fechado = jaFechou();

  function movsDoDia(dia){

          var x = f.por[k], extras = [];
          if (x.fornos) extras.push(x.fornos + ' no forno');
          if (x.ajustes) extras.push(x.ajustes + (x.ajustes === 1 ? ' ajuste' : ' ajustes'));
          out += '<div class="ds">'
            + '<span class="nm"><span class="ponto" style="background:' + esc(x.cor || '#A56B3E') + '"></span>'
            + esc(x.nome) + (extras.length ? '<i class="ex">' + esc(extras.join(' · ')) + '</i>' : '') + '</span>'
            + '<b>' + (x.vendidos ? x.vendidos + ' vend.' : '—') + '</b>'
            + '<i>' + (x.faturamento ? moeda(x.faturamento) : '') + '</i>'
            + '</div>';
        });
        out += '</div>';
      }

      var nl = mapa[d].length;
      out += '<button class="ver-lanc" data-acao="abrir-dia" data-dia="' + esc(d) + '" aria-expanded="' + aberto + '" type="button">'
        + (aberto ? 'esconder' : 'ver') + (nl === 1 ? ' o lançamento' : ' os ' + nl + ' lançamentos')
        + '<span class="seta">' + (aberto ? '▴' : '▾') + '</span></button>';

      if (aberto) out += '<div class="lancs">' + listaMovs(mapa[d]) + '</div>';
      out += '<button class="btn planilha-dia fina" data-acao="planilha-dia" data-dia="' + esc(d) + '" type="button">'
        + ICO_PLAN + 'Planilha deste dia</button>';
      out += '</section>';
    });

    out += '<div class="acoes-sheet" style="margin-top:14px">'
      + '<button class="btn fantasma" data-acao="csv" type="button">Exportar</button></div>';
    out += '<button class="btn fantasma full zerar" data-acao="limpar" type="button">Limpar tudo e começar do zero</button>';
    return out + rodape();
  }

  function rodape(){
    var nuvem = S.fonte === 'nuvem';
    return '<div class="rodape"><span class="sync"><span class="bolinha' + (nuvem ? '' : ' local') + '"></span>'
      + (nuvem ? 'Salvo na nuvem — abre igual em qualquer aparelho' : 'Salvo neste aparelho') + '</span>'
      + '<button class="btn destrancar" data-acao="trancar" type="button">Trancar o app</button></div>';
  }

  /* ============ render ============ */
  var elView = document.getElementById('view');
  function focoEmCampo(){
    var a = document.activeElement;
    return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && elView.contains(a));
  }
  function render(){
    if (focoEmCampo()){ sujo = true; atualizarBarra(); return; }
    sujo = false;
    atualizarBarra();
    elView.innerHTML = S.aba === 'planilha' ? telaPlanilha()
      : S.aba === 'historico' ? telaHistorico() : telaEstoque();
    pintarAviso();
  }
  var CHAVE_VISTO = 'mf.fechamento.visto';
  function fechamentoNaoVisto(){
    if (!jaFechou()) return false;
    var hoje = hojeISO();
    if (S.aba === 'historico') return false;
    try { if (localStorage.getItem(CHAVE_VISTO) === hoje) return false; } catch (e) {}
    return true;
  }
  function marcarVisto(){
    try { localStorage.setItem(CHAVE_VISTO, hojeISO()); } catch (e) {}
  }
  function pintarAviso(){
    var aba = document.getElementById('aba-historico');
    if (!aba) return;
    var tem = !!aba.querySelector('.badge');
    var quer = fechamentoNaoVisto();
    if (quer && !tem){
      var i = document.createElement('span');
      i.className = 'badge';
      i.setAttribute('aria-label', 'Fechamento do dia pronto');
      aba.appendChild(i);
    } else if (!quer && tem){
      aba.querySelector('.badge').remove();
    }
  }

  function atualizarBarra(){
    var t = totais();
    document.getElementById('barra-total').textContent = t.vender;
    document.getElementById('barra-rotulo').textContent = 'pra vender';
  }
  function pintarCartao(id){
    var cartao = document.querySelector('[data-cartao="' + id + '"]');
    var s = acharSabor(id);
    if (!cartao || !s){ render(); return; }
    var q = qtdNaTela(s), d = deltaFila(id), sit = situacao(s);
    var alvo = cartao.querySelector('.cont.vender');
    if (alvo){
      alvo.className = 'cont vender' + (q ? '' : ' zero');
      alvo.innerHTML = '<em>Pra vender</em><b>' + q + '</b>' + capPend(d);
    }
    var pill = cartao.querySelector('.pill');
    if (pill){ pill.className = 'pill ' + sit.cls; pill.textContent = sit.txt; }
    var vl = cartao.querySelector('.vl');
    if (vl) vl.textContent = moeda(q * nn(s.preco));
    var res = document.getElementById('resumo');
    if (res) res.innerHTML = blocoResumo();

  }
  elView.addEventListener('focusout', function(){
    setTimeout(function(){ if (sujo && !focoEmCampo()) render(); }, 60);
  });

  /* ============ abas ============ */
  Array.prototype.forEach.call(document.querySelectorAll('[data-aba]'), function(b){
    b.addEventListener('click', function(){
      escoar();
      S.aba = b.getAttribute('data-aba');
      if (S.aba === 'historico') marcarVisto();
