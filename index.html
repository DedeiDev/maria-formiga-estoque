<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Controle de estoque de cookies da Doceria Maria Formiga: quantidade, preco, vendas e historico, direto do celular.">
<meta name="theme-color" content="#EDD9B2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1108" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maria Formiga">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="assets/apple-touch-icon.jpg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.jpg">
<link rel="manifest" href="manifest.webmanifest">
<title>Estoque Maria Formiga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..900,0..100,0..1&family=DM+Sans:opsz,wght@9..40,400..700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* ---------- tokens: claro (mundo creme da marca) ---------- */
:root{
  --bg:#EDD9B2;
  --bg-deep:#E2C99A;
  --surface:#FBF3E4;
  --surface-2:#F4E7CE;
  --ink:#3A1C10;
  --ink-soft:#8A6440;
  --ink-faint:#A9855D;
  --accent:#6E2B1C;
  --accent-2:#8C3A25;
  --on-accent:#FBF3E4;
  --caramel:#A56B3E;
  --line:rgba(110,43,28,.14);
  --line-strong:rgba(110,43,28,.30);
  --ring:rgba(58,28,16,.26);
  --ok:#4F7A45;
  --warn:#A96A12;
  --crit:#AE3527;
  --ok-bg:rgba(79,122,69,.14);
  --warn-bg:rgba(169,106,18,.16);
  --crit-bg:rgba(174,53,39,.13);
  --shadow-sm:0 1px 0 rgba(110,43,28,.05), 0 2px 6px -3px rgba(58,28,16,.30);
  --shadow-md:0 1px 0 rgba(110,43,28,.05), 0 14px 28px -18px rgba(58,28,16,.55);
  --shadow-sheet:0 -18px 44px -18px rgba(41,19,10,.55);
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
  --tap:46px;
  --font-ui:"DM Sans","Helvetica Neue",Arial,sans-serif;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  --font-num:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
/* ---------- tokens: escuro (mundo café) ---------- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1108;
    --bg-deep:#150B05;
    --surface:#2C1A0E;
    --surface-2:#382214;
    --ink:#F4E3C6;
    --ink-soft:#C0996C;
    color-scheme:dark;
  }
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink-faint:#9A7952;
    --accent:#D9954F;
    --accent-2:#E8A863;
    --on-accent:#26150A;
    --caramel:#C98F55;
    --line:rgba(244,227,198,.13);
    --line-strong:rgba(244,227,198,.26);
    --ring:rgba(244,227,198,.30);
    --ok:#83B074;
    --warn:#D9A345;
    --crit:#E0796A;
    --ok-bg:rgba(131,176,116,.16);
    --warn-bg:rgba(217,163,69,.16);
    --crit-bg:rgba(224,121,106,.15);
    --shadow-sm:0 1px 0 rgba(0,0,0,.20), 0 2px 6px -3px rgba(0,0,0,.55);
    --shadow-md:0 1px 0 rgba(0,0,0,.20), 0 14px 30px -18px rgba(0,0,0,.85);
    --shadow-sheet:0 -18px 44px -16px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --bg:#1E1108;
  --bg-deep:#150B05;
  --surface:#2C1A0E;
  --surface-2:#382214;
  --ink:#F4E3C6;
  --ink-soft:#C0996C;
  --ink-faint:#9A7952;
  --accent:#D9954F;
  --accent-2:#E8A863;
  --on-accent:#26150A;
  --caramel:#C98F55;
  --line:rgba(244,227,198,.13);
  --line-strong:rgba(244,227,198,.26);
  --ring:rgba(244,227,198,.30);
  --ok:#83B074;
  --warn:#D9A345;
  --crit:#E0796A;
  --ok-bg:rgba(131,176,116,.16);
  --warn-bg:rgba(217,163,69,.16);
  --crit-bg:rgba(224,121,106,.15);
  --shadow-sm:0 1px 0 rgba(0,0,0,.20), 0 2px 6px -3px rgba(0,0,0,.55);
  --shadow-md:0 1px 0 rgba(0,0,0,.20), 0 14px 30px -18px rgba(0,0,0,.85);
  --shadow-sheet:0 -18px 44px -16px rgba(0,0,0,.75);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
img{max-width:100%}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:16px;
  line-height:1.45;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--caramel);color:var(--surface)}

/* ---------- casca do app ---------- */
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:620px;margin:0 auto;position:relative}

.appbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:12px;
  padding:10px 16px 10px;
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
}
.selo{
  width:44px;height:44px;flex:none;border-radius:50%;
  object-fit:cover;display:block;
  border:1.5px solid var(--line-strong);
  box-shadow:var(--shadow-sm);
  background:var(--surface-2);
}
.marca{display:flex;flex-direction:column;min-width:0;flex:1}
.marca b{
  font-family:var(--font-display);
  font-variation-settings:"SOFT" 60,"WONK" 1,"opsz" 40;
  font-weight:800;font-size:1.16rem;line-height:1.05;letter-spacing:-.01em;
  color:var(--accent);
}
.marca span{
  font-size:.66rem;text-transform:uppercase;letter-spacing:.16em;
  color:var(--ink-faint);font-weight:600;
}
.appbar .totalzinho{text-align:right;line-height:1.05}
.appbar .totalzinho b{
  font-family:var(--font-display);font-variation-settings:"SOFT" 60,"opsz" 60;
  font-weight:800;font-size:1.5rem;display:block;font-variant-numeric:tabular-nums;
}
.appbar .totalzinho span{font-size:.62rem;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-faint);font-weight:600}

main{flex:1;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}

/* ---------- resumo do dia ---------- */
.resumo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tile{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:12px 14px;box-shadow:var(--shadow-sm);
}
.tile em{
  display:block;font-style:normal;font-size:.63rem;text-transform:uppercase;
  letter-spacing:.13em;color:var(--ink-faint);font-weight:700;margin-bottom:2px;
}
.tile b{
  font-family:var(--font-display);font-variation-settings:"SOFT" 60,"opsz" 60;
  font-weight:800;font-size:1.6rem;line-height:1.1;display:block;
  font-variant-numeric:tabular-nums;letter-spacing:-.015em;
}
.tile small{color:var(--ink-soft);font-size:.76rem;font-variant-numeric:tabular-nums}

/* ---------- títulos de seção ---------- */
.secao{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.secao h2{
  margin:0;font-family:var(--font-display);
  font-variation-settings:"SOFT" 55,"opsz" 30;font-weight:700;
  font-size:1.02rem;letter-spacing:-.005em;
}
.secao .dica{font-size:.74rem;color:var(--ink-faint)}

/* ---------- cartão de sabor ---------- */
.sabores{display:flex;flex-direction:column;gap:10px}
.sabor{
  position:relative;display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  grid-template-areas:"chip nome qtd" "chip meta qtd" "acoes acoes acoes";
  align-items:center;column-gap:11px;row-gap:1px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:11px 11px 11px 13px;
  box-shadow:var(--shadow-sm);
  transition:box-shadow .25s ease, border-color .25s ease;
}
.sabor.pulso{border-color:var(--caramel);box-shadow:var(--shadow-md),0 0 0 3px var(--warn-bg)}
.sabor .chip{
  grid-area:chip;width:36px;height:36px;border-radius:12px;
  box-shadow:inset 0 0 0 1.5px var(--ring), inset 0 -7px 11px -6px rgba(0,0,0,.45);
}
.sabor .nome{
  grid-area:nome;align-self:end;
  font-family:var(--font-display);font-variation-settings:"SOFT" 55,"opsz" 30;
  font-weight:700;font-size:1.05rem;line-height:1.2;letter-spacing:-.005em;
  margin:0;display:flex;align-items:center;gap:7px;min-width:0;
}
.sabor .nome span.pill{flex:none}
.sabor .meta{
  grid-area:meta;align-self:start;margin:0;
  font-size:.755rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;
}
.sabor .meta .sep{color:var(--ink-faint)}
.editar{
  font-size:.7rem;font-weight:700;color:var(--caramel);
  text-decoration:underline;text-decoration-style:dotted;
  text-decoration-color:var(--line-strong);text-underline-offset:3px;
}

.pill{
  display:inline-flex;align-items:center;gap:4px;
  font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  padding:3px 7px;border-radius:var(--r-pill);white-space:nowrap;
}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}

/* numero do estoque: toque abre o teclado de lancamento */
.qtd{
  grid-area:qtd;min-width:70px;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:5px 6px;border-radius:14px;border:1px solid transparent;
  transition:background .15s ease, transform .1s ease;
}
.qtd:active{background:var(--surface-2);transform:scale(.96)}
.qtd b{
  font-family:var(--font-display);font-variation-settings:"SOFT" 60,"opsz" 72;
  font-weight:800;font-size:2rem;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em;
}
.qtd .cap{
  font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);
}
.qtd.zero b{color:var(--ink-faint)}
.qtd .cap.pend{color:var(--caramel);text-transform:none;letter-spacing:.01em;font-size:.63rem}

.acoes-sabor{
  grid-area:acoes;display:flex;gap:8px;margin-top:10px;
  padding-top:10px;border-top:1px dashed var(--line);
}
.btn-linha{
  flex:1;min-height:44px;border-radius:13px;
  border:1px solid var(--line);background:var(--surface-2);
  font-size:.82rem;font-weight:700;color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .09s ease, background .15s ease;
}
.btn-linha:active{transform:scale(.97);background:var(--bg-deep)}
.btn-linha.venda{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn-linha.venda:active{background:var(--accent-2)}

/* ---------- planilha ---------- */
.tabela-wrap{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow-sm);overflow-x:auto;-webkit-overflow-scrolling:touch;
}
table{border-collapse:collapse;width:100%;min-width:430px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{
  font-size:.61rem;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-faint);
  font-weight:700;background:var(--surface-2);position:sticky;top:0;
}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
th:first-child{background:var(--surface-2);z-index:2}
tbody tr:last-child td{border-bottom:0}
td.nomecel{font-weight:600}
td.nomecel .ponto{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;box-shadow:inset 0 0 0 1.5px var(--ring);vertical-align:baseline}
td.nomecel .editar{color:var(--ink);font-size:.88rem}
.cel{
  width:66px;padding:7px 8px;border:1px solid transparent;border-radius:9px;
  background:var(--surface-2);text-align:right;
  font-family:var(--font-num);font-size:15px;font-weight:500;
  font-variant-numeric:tabular-nums;
}
.cel:focus{border-color:var(--accent);background:var(--surface);outline:none}
tfoot td{
  font-weight:700;background:var(--surface-2);border-top:1.5px solid var(--line-strong);
  font-variant-numeric:tabular-nums;
}
tfoot td:first-child{background:var(--surface-2)}
.valorcel{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* ---------- histórico ---------- */
.dia{margin-bottom:18px}
.dia-cab{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:0 2px 7px;margin-bottom:0;border-bottom:1.5px solid var(--line-strong);
}
.dia-cab b{
  font-family:var(--font-display);font-variation-settings:"SOFT" 55,"opsz" 24;
  font-weight:700;font-size:.95rem;
}
.dia-cab span{font-size:.74rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.mov{
  display:grid;grid-template-columns:52px 1fr auto auto;
  align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);
}
.mov .hora{font-family:var(--font-num);font-size:.76rem;color:var(--ink-faint)}
.mov .oq{min-width:0}
.mov .oq b{display:block;font-size:.9rem;font-weight:600;line-height:1.2}
.mov .oq span{font-size:.72rem;color:var(--ink-soft)}
.mov .delta{
  font-family:var(--font-num);font-weight:500;font-size:.95rem;
  font-variant-numeric:tabular-nums;
}
.mov .delta.mais{color:var(--ok)}
.mov .delta.menos{color:var(--crit)}
.mov .apagar{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  color:var(--ink-faint);border:1px solid transparent;
}
.mov .apagar:active{background:var(--crit-bg);color:var(--crit)}
.mov .apagar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

/* ---------- vazio / rodapé ---------- */
.vazio{
  text-align:center;padding:34px 20px;border:1.5px dashed var(--line-strong);
  border-radius:var(--r-lg);background:var(--surface-2);
  background:color-mix(in srgb, var(--surface) 55%, transparent);
}
.vazio p{margin:0 0 4px;font-family:var(--font-display);font-variation-settings:"SOFT" 55;font-weight:700;font-size:1rem}
.vazio small{color:var(--ink-soft);display:block;max-width:34ch;margin:0 auto 14px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:var(--tap);padding:0 18px;border-radius:14px;
  background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.92rem;
  transition:transform .09s ease, background .15s ease;
}
.btn:active{transform:scale(.97);background:var(--accent-2)}
.btn.fantasma{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.fantasma:active{background:var(--bg-deep)}
.btn.perigo{background:var(--crit-bg);color:var(--crit);border:1px solid transparent}
.btn.full{width:100%}
.rodape{
  margin-top:26px;text-align:center;font-size:.7rem;color:var(--ink-faint);
  display:flex;flex-direction:column;gap:4px;align-items:center;
}
.rodape .sync{display:inline-flex;align-items:center;gap:6px}
.rodape .bolinha{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.rodape .bolinha.local{background:var(--warn)}

/* ---------- abas ---------- */
.abas{
  position:fixed;bottom:0;left:0;right:0;z-index:45;
  display:flex;justify-content:center;gap:2px;
  padding:6px 10px calc(6px + env(safe-area-inset-bottom));
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-top:1px solid var(--line);
}
.abas .in{display:flex;gap:2px;width:100%;max-width:620px}
.abas button{
  flex:1;min-height:52px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-faint);font-size:.66rem;font-weight:700;
  letter-spacing:.03em;transition:color .18s ease, background .18s ease;
}
.abas button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.abas button[aria-selected="true"]{color:var(--accent);background:var(--surface)}
.abas button:active{background:var(--surface-2)}

/* ---------- bottom sheet ---------- */
.backdrop{
  position:fixed;inset:0;z-index:60;background:rgba(41,19,10,.55);
  opacity:0;pointer-events:none;transition:opacity .22s ease;
  backdrop-filter:blur(2px);
}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  max-height:92vh;
  max-width:620px;margin:0 auto;
  background:var(--surface);
  border-radius:26px 26px 0 0;
  border-top:1px solid var(--line);
  box-shadow:var(--shadow-sheet);
  padding:8px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .3s cubic-bezier(.32,.8,.3,1);
  max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.sheet.on{transform:translateY(0)}
.puxador{width:42px;height:4.5px;border-radius:99px;background:var(--line-strong);margin:4px auto 12px}
.sheet-cab{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.sheet-cab .chip{width:32px;height:32px;border-radius:10px;flex:none;box-shadow:inset 0 0 0 1.5px var(--ring)}
.sheet-cab h3{
  margin:0;font-family:var(--font-display);font-variation-settings:"SOFT" 55,"opsz" 40;
  font-weight:800;font-size:1.2rem;line-height:1.1;flex:1;
}
.sheet-cab .fechar{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-soft);font-size:1.15rem;line-height:1}

.modos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-2);padding:5px;border-radius:15px;margin-bottom:14px}
.modos button{
  min-height:42px;border-radius:11px;font-size:.8rem;font-weight:700;color:var(--ink-soft);
  display:flex;flex-direction:column;gap:1px;align-items:center;justify-content:center;line-height:1.15;
}
.modos button small{font-size:.6rem;font-weight:600;opacity:.8}
.modos button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-sm)}

.visor{
  text-align:center;padding:6px 0 12px;
}
.visor .num{
  font-family:var(--font-display);font-variation-settings:"SOFT" 60,"opsz" 96;
  font-weight:800;font-size:3.1rem;line-height:1;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.visor .num.vazio-num{color:var(--ink-faint)}
.visor .previa{font-size:.82rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;margin-top:6px;min-height:1.2em}
.visor .previa b{color:var(--ink);font-weight:700}

.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.teclado button{
  min-height:52px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line);
  font-family:var(--font-display);font-variation-settings:"SOFT" 60,"opsz" 40;
  font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;
  transition:transform .07s ease, background .12s ease;
}
.teclado button:active{transform:scale(.94);background:var(--bg-deep)}
.teclado button.aux{font-family:var(--font-ui);font-size:.95rem;font-weight:700;color:var(--ink-soft)}
.teclado button.aux svg{width:24px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.campo{display:block;margin-bottom:13px}
.campo span{
  display:block;font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;
  font-weight:700;color:var(--ink-faint);margin-bottom:5px;
}
.campo input{
  width:100%;min-height:48px;padding:0 14px;border-radius:13px;
  background:var(--surface-2);border:1px solid var(--line);
  font-size:16px;font-weight:600;
}
.campo input:focus{border-color:var(--accent);background:var(--surface);outline:none}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cores{display:flex;gap:9px;flex-wrap:wrap}
.cores button{
  width:38px;height:38px;border-radius:12px;
  box-shadow:inset 0 0 0 1.5px var(--ring);
}
.cores button[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--ring),0 0 0 3px var(--accent)}
.acoes-sheet{display:flex;gap:9px;margin-top:6px}
.acoes-sheet .btn{flex:1}
.csv{
  width:100%;min-height:190px;border-radius:13px;padding:12px;
  background:var(--surface-2);border:1px solid var(--line);
  font-family:var(--font-num);font-size:13px;line-height:1.6;resize:vertical;
}
.aviso{font-size:.76rem;color:var(--ink-soft);margin:0 0 12px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));
  z-index:70;max-width:596px;margin:0 auto;
  display:flex;align-items:center;gap:12px;
  padding:11px 12px 11px 15px;border-radius:16px;
  background:var(--ink);color:var(--bg);
  box-shadow:var(--shadow-md);
  transform:translateY(140%);opacity:0;pointer-events:none;
  transition:transform .28s cubic-bezier(.32,.8,.3,1), opacity .2s ease;
}
.toast.on{transform:translateY(0);opacity:1;pointer-events:auto}
.toast p{margin:0;flex:1;font-size:.85rem;font-weight:600;line-height:1.3}
.toast p small{display:block;font-weight:500;opacity:.72;font-size:.76rem}
.toast button{
  flex:none;min-height:38px;padding:0 14px;border-radius:11px;
  background:rgba(255,255,255,.20);
  background:color-mix(in srgb, var(--bg) 22%, transparent);
  color:var(--bg);font-weight:700;font-size:.82rem;
}
.toast button:active{background:color-mix(in srgb, var(--bg) 34%, transparent)}

@keyframes surge{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.painel{animation:surge .26s ease both}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
  .sheet{transition:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <img class="selo" src="assets/logo-mark.jpg" alt="Doceria Maria Formiga" width="44" height="44">
    <div class="marca">
      <b>Maria Formiga</b>
      <span>Controle de cookies</span>
    </div>
    <div class="totalzinho">
      <b id="barra-total">0</b>
      <span id="barra-rotulo">cookies</span>
    </div>
  </header>

  <main id="view"></main>

  <nav class="abas" role="tablist" aria-label="Seções do controle">
    <div class="in">
      <button role="tab" id="aba-estoque" data-aba="estoque" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><circle cx="9.2" cy="9.6" r="1.15" fill="currentColor" stroke="none"/><circle cx="14.8" cy="11" r="1.15" fill="currentColor" stroke="none"/><circle cx="10.4" cy="15" r="1.15" fill="currentColor" stroke="none"/><circle cx="15" cy="15.6" r="1" fill="currentColor" stroke="none"/></svg>
        Estoque
      </button>
      <button role="tab" id="aba-planilha" data-aba="planilha" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="4.2" width="17.6" height="15.6" rx="2.4"/><path d="M3.2 9.4h17.6M9.4 9.4v10.4M15 9.4v10.4"/></svg>
        Planilha
      </button>
      <button role="tab" id="aba-historico" data-aba="historico" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.4v4.9l3.5 2.1"/></svg>
        Histórico
      </button>
    </div>
  </nav>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Painel de ação"></div>
<div class="toast" id="toast" role="status" aria-live="polite">
  <p id="toast-txt"></p>
  <button id="toast-btn" type="button">Desfazer</button>
</div>

<script>
(function(){
  'use strict';

  /* ============ formatos ============ */
  var BRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
  var DIA = new Intl.DateTimeFormat('pt-BR', {weekday:'long', day:'2-digit', month:'long'});
  var HORA = new Intl.DateTimeFormat('pt-BR', {hour:'2-digit', minute:'2-digit'});
  function moeda(v){ return BRL.format(Number(v) || 0); }
  function nn(v){ var n = Number(v); return isFinite(n) ? n : 0; }
  function maiusc1(t){ t = String(t); return t.charAt(0).toUpperCase() + t.slice(1); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function precoBR(v){ return nn(v).toFixed(2).replace('.', ','); }
  function lerNumeroBR(s){
    var t = String(s == null ? '' : s).replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.');
    var n = parseFloat(t); return isFinite(n) ? n : 0;
  }
  function novoId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function slug(s){
    var base = String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
    return base || ('sabor-' + novoId());
  }

  /* ============ cores dos sabores (tons da marca) ============ */
  var CORES = ['#4C2212', '#6E2B1C', '#7B3F1D', '#A56B3E', '#C08A4A', '#D8C69B'];
  var DA_CASA = [
    {nome:'Chocolatudo', cor:'#4C2212'},
    {nome:'Kinder',      cor:'#C08A4A'},
    {nome:'Nutella',     cor:'#7B3F1D'},
    {nome:'Ninho',       cor:'#D8C69B'}
  ];
  function saboresDaCasa(){
    return DA_CASA.map(function(s, i){
      return {id:slug(s.nome), nome:s.nome, cor:s.cor, qtd:0, preco:12, minimo:6, ordem:(i + 1) * 10};
    });
  }

  /* ============ estado ============ */
  var S = {sabores:[], movs:[], aba:'estoque', db:null, fonte:'local', prontoNuvem:false};
  var CHAVE = 'mf.cookies.v1';
  var sujo = false, ultimoMov = null, tToast = null;

  function ordenar(){ S.sabores.sort(function(a, b){ return nn(a.ordem) - nn(b.ordem); }); }
  function corpo(s){
    return {nome:s.nome, cor:s.cor, qtd:nn(s.qtd), preco:nn(s.preco), minimo:nn(s.minimo), ordem:nn(s.ordem)};
  }
  function acharSabor(id){
    for (var i = 0; i < S.sabores.length; i++) if (S.sabores[i].id === id) return S.sabores[i];
    return null;
  }

  /* ============ guarda local (aparelho) ============ */
  function lerLocal(){
    try { return JSON.parse(localStorage.getItem(CHAVE)); } catch (e) { return null; }
  }
  function salvarLocal(){
    if (S.db) return;
    try { localStorage.setItem(CHAVE, JSON.stringify({sabores:S.sabores, movs:S.movs.slice(0, 400)})); } catch (e) {}
  }
  function iniciarLocal(){
    var d = lerLocal();
    if (d && d.sabores && d.sabores.length){ S.sabores = d.sabores; S.movs = d.movs || []; }
    else { S.sabores = saboresDaCasa(); S.movs = []; salvarLocal(); }
    ordenar();
  }

  /* ============ guarda na nuvem (db do artifact) ============ */
  function conectarNuvem(){
    if (!window.claude || typeof window.claude.use !== 'function') return;
    window.claude.use('db').then(function(db){
      if (!db) return;
      S.db = db;
      S.fonte = 'nuvem';
      db.collection('estoque').orderBy('ordem').onSnapshot(function(snap){
        S.sabores = snap.docs.map(function(d){
          var o = d.data() || {}; o.id = d.id; return o;
        });
        S.prontoNuvem = true;
        render();
      }, function(){ S.db = null; S.fonte = 'local'; iniciarLocal(); render(); });
      db.collection('movimentos').orderBy('ts', 'desc').limit(300).onSnapshot(function(snap){
        S.movs = snap.docs.map(function(d){
          var o = d.data() || {}; o.id = d.id; return o;
        });
        render();
      }, function(){});
    }).catch(function(){});
  }

  /* ============ gravações ============ */
  function erro(e){
    var c = e && e.code;
    if (c === 'quota_exceeded') toast('Histórico cheio', 'Apague registros antigos na aba Histórico.');
    else toast('Não deu para salvar', 'Tente de novo em alguns segundos.');
  }
  function atualizarSabor(id, patch){
    if (S.db) return S.db.doc('estoque/' + id).update(patch).catch(erro);
    var s = acharSabor(id);
    if (s){ for (var k in patch) s[k] = patch[k]; ordenar(); salvarLocal(); render(); }
    return Promise.resolve();
  }
  function criarSabor(s){
    if (S.db) return S.db.doc('estoque/' + s.id).set(corpo(s)).catch(erro);
    S.sabores.push(s); ordenar(); salvarLocal(); render();
    return Promise.resolve();
  }
  function removerSabor(id){
    if (S.db) return S.db.doc('estoque/' + id).delete().catch(erro);
    S.sabores = S.sabores.filter(function(s){ return s.id !== id; });
    salvarLocal(); render();
    return Promise.resolve();
  }
  function gravarMov(m){
    if (S.db){
      var b = {}; for (var k in m) if (k !== 'id') b[k] = m[k];
      return S.db.doc('movimentos/' + m.id).set(b).catch(erro);
    }
    S.movs.unshift(m); S.movs = S.movs.slice(0, 400); salvarLocal(); render();
    return Promise.resolve();
  }
  function removerMov(id){
    if (S.db) return S.db.doc('movimentos/' + id).delete().catch(erro);
    S.movs = S.movs.filter(function(m){ return m.id !== id; });
    salvarLocal(); render();
    return Promise.resolve();
  }

  /* ============ registrar movimento ============ */
  var ROTULO = {venda:'Venda', fornada:'Fornada', ajuste:'Contagem ajustada'};

  function registrar(sabor, tipo, valorDigitado){
    var antes = nn(sabor.qtd), depois;
    if (tipo === 'ajuste') depois = Math.max(0, Math.round(valorDigitado));
    else if (tipo === 'fornada') depois = antes + Math.round(valorDigitado);
    else depois = Math.max(0, antes - Math.round(valorDigitado));
    var delta = depois - antes;
    if (!delta) { pulsar(sabor.id); return Promise.resolve(); }

    var preco = nn(sabor.preco);
    var m = {
      id:novoId(), tipo:tipo, saborId:sabor.id, sabor:sabor.nome, cor:sabor.cor,
      qtd:Math.abs(delta), delta:delta, preco:preco,
      valor:(tipo === 'venda' ? Math.abs(delta) * preco : 0),
      antes:antes, depois:depois, ts:new Date().toISOString()
    };
    return atualizarSabor(sabor.id, {qtd:depois}).then(function(){
      return gravarMov(m);
    }).then(function(){
      pulsar(sabor.id);
      ultimoMov = m;
      var det = m.tipo === 'venda' && m.valor ? moeda(m.valor) : (antes + ' → ' + depois + ' na prateleira');
      toast(ROTULO[tipo] + ' · ' + m.qtd + ' ' + m.sabor, det, true);
    });
  }

  function desfazer(){
    if (!ultimoMov) return;
    var m = ultimoMov; ultimoMov = null;
    var s = acharSabor(m.saborId);
    esconderToast();
    Promise.resolve(s ? atualizarSabor(m.saborId, {qtd:m.antes}) : null).then(function(){
      return removerMov(m.id);
    }).then(function(){ toast('Desfeito', m.sabor + ' voltou para ' + m.antes + '.'); });
  }

  /* ============ lançamentos em fila (toques repetidos) ============ */
  var fila = null;
  function enfileirar(sabor, tipo, passo){
    if (fila && (fila.id !== sabor.id || fila.tipo !== tipo)) escoar();
    if (!fila) fila = {id:sabor.id, tipo:tipo, qtd:0, timer:null};
    fila.qtd += passo;
    var alvo = sabor.id;
    if (fila.qtd <= 0){ clearTimeout(fila.timer); fila = null; pintarCartao(alvo); return; }
    clearTimeout(fila.timer);
    fila.timer = setTimeout(escoar, 850);
    pintarCartao(alvo);
  }
  function escoar(){
    if (!fila) return;
    var f = fila; fila = null;
    clearTimeout(f.timer);
    var s = acharSabor(f.id);
    if (s && f.qtd > 0) registrar(s, f.tipo, f.qtd); else pintarCartao(f.id);
  }
  function deltaFila(id){
    if (!fila || fila.id !== id) return 0;
    return fila.tipo === 'venda' ? -fila.qtd : fila.qtd;
  }
  function qtdNaTela(s){ return Math.max(0, nn(s.qtd) + deltaFila(s.id)); }

  /* ============ toast ============ */
  var elToast = document.getElementById('toast');
  var elToastTxt = document.getElementById('toast-txt');
  var elToastBtn = document.getElementById('toast-btn');
  function toast(titulo, detalhe, comDesfazer){
    elToastTxt.innerHTML = esc(titulo) + (detalhe ? '<small>' + esc(detalhe) + '</small>' : '');
    elToastBtn.hidden = !comDesfazer;
    elToast.classList.add('on');
    clearTimeout(tToast);
    tToast = setTimeout(esconderToast, comDesfazer ? 5200 : 2600);
  }
  function esconderToast(){ elToast.classList.remove('on'); clearTimeout(tToast); }
  elToastBtn.addEventListener('click', desfazer);

  function pulsar(id){
    var el = document.querySelector('[data-cartao="' + id + '"]');
    if (!el) return;
    el.classList.add('pulso');
    setTimeout(function(){ el.classList.remove('pulso'); }, 620);
  }

  /* ============ contas ============ */
  function totais(){
    var t = {qtd:0, valor:0, baixos:0};
    S.sabores.forEach(function(s){
      var q = qtdNaTela(s);
      t.qtd += q; t.valor += q * nn(s.preco);
      if (q <= 0 || q <= nn(s.minimo)) t.baixos++;
    });
    return t;
  }
  function hojeISO(){
    var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function doDia(dia){
    var r = {vendidos:0, faturamento:0, produzidos:0};
    S.movs.forEach(function(m){
      if (String(m.ts).slice(0, 10) !== dia) return;
      if (m.tipo === 'venda'){ r.vendidos += nn(m.qtd); r.faturamento += nn(m.valor); }
      if (m.tipo === 'fornada') r.produzidos += nn(m.qtd);
    });
    return r;
  }
  function situacao(s){
    var q = qtdNaTela(s), min = nn(s.minimo);
    if (q <= 0) return {cls:'crit', txt:'Acabou'};
    if (min > 0 && q <= min) return {cls:'warn', txt:'Acabando'};
    return {cls:'ok', txt:'Ok'};
  }

  /* ============ ícones ============ */
  var ICO_APAGA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 5h11.4a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H8.6L2.6 12z"/><path d="M12.4 9.4l5.2 5.2M17.6 9.4l-5.2 5.2"/></svg>';
  var ICO_LIXO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V5.2h5V7M6.6 7l.9 12.3h9l.9-12.3"/></svg>';

  function capQtd(d){
    if (!d) return '<span class="cap">lançar</span>';
    return '<span class="cap pend">' + (d < 0 ? 'vendendo ' + Math.abs(d) : 'entrando ' + d) + '</span>';
  }

  /* ============ tela: estoque ============ */
  function blocoResumo(){
    var t = totais(), h = doDia(hojeISO());
    return '<div class="tile"><em>Vendidos hoje</em><b>' + h.vendidos + '</b><small>' + moeda(h.faturamento) + ' no caixa</small></div>'
      + '<div class="tile"><em>Valor na prateleira</em><b>' + moeda(t.valor) + '</b><small>'
      + t.qtd + ' cookie' + (t.qtd === 1 ? '' : 's') + (t.baixos ? ' · ' + t.baixos + ' para repor' : '') + '</small></div>';
  }
  function telaEstoque(){
    var out = '<section class="resumo" id="resumo">' + blocoResumo() + '</section>';

    out += '<div class="secao"><h2>Meus cookies</h2><span class="dica">segure para repetir</span></div>';

    if (!S.sabores.length){
      out += '<div class="vazio"><p>Nenhum sabor ainda</p><small>Cadastre os sabores que você faz e o estoque passa a andar com você.</small>'
        + '<div class="acoes-sheet"><button class="btn" data-acao="criar-casa" type="button">Usar os 4 da casa</button>'
        + '<button class="btn fantasma" data-acao="novo-sabor" type="button">+ Outro sabor</button></div></div>';
    } else {
      out += '<div class="sabores">';
      S.sabores.forEach(function(s){
        var q = qtdNaTela(s), sit = situacao(s), d = deltaFila(s.id);
        out += '<article class="sabor" data-cartao="' + esc(s.id) + '">'
          + '<span class="chip" style="background:' + esc(s.cor || '#A56B3E') + '"></span>'
          + '<h3 class="nome">' + esc(s.nome) + '<span class="pill ' + sit.cls + '">' + sit.txt + '</span></h3>'
          + '<p class="meta"><span class="pr">' + moeda(s.preco) + '</span> un <span class="sep">·</span> '
          + '<span class="vl">' + moeda(q * nn(s.preco)) + '</span> <span class="sep">·</span> '
          + '<button class="editar" data-acao="editar" data-id="' + esc(s.id) + '" type="button">editar</button></p>'
          + '<button class="qtd' + (q ? '' : ' zero') + '" data-acao="lancar" data-id="' + esc(s.id) + '" aria-label="Lançar venda, fornada ou ajuste de ' + esc(s.nome) + '" type="button">'
          + '<b>' + q + '</b>' + capQtd(d) + '</button>'
          + '<div class="acoes-sabor">'
          + '<button class="btn-linha venda" data-rep="venda" data-id="' + esc(s.id) + '" aria-label="Vender um ' + esc(s.nome) + '" type="button">− Vendi 1</button>'
          + '<button class="btn-linha" data-rep="fornada" data-id="' + esc(s.id) + '" aria-label="Entrar um ' + esc(s.nome) + '" type="button">+ Entrou 1</button>'
          + '</div>'
          + '</article>';
      });
      out += '</div>';
      out += '<div class="secao"><h2>Sabores</h2></div>'
        + '<button class="btn fantasma full" data-acao="novo-sabor" type="button">+ Novo sabor</button>';
    }
    return out + rodape();
  }

  /* ============ tela: planilha ============ */
  function telaPlanilha(){
    var t = totais(), out = '';
    out += '<div class="secao"><h2>Planilha</h2><span class="dica">toque e escreva · arraste o lado</span></div>';
    if (!S.sabores.length){
      out += '<div class="vazio"><p>Planilha vazia</p><small>Cadastre um sabor para começar a preencher.</small>'
        + '<button class="btn" data-acao="novo-sabor" type="button">+ Novo sabor</button></div>';
      return out + rodape();
    }
    out += '<div class="tabela-wrap"><table><thead><tr>'
      + '<th scope="col">Sabor</th><th scope="col">Qtd</th><th scope="col">Preço</th><th scope="col">Mínimo</th><th scope="col">Valor</th>'
      + '</tr></thead><tbody>';
    S.sabores.forEach(function(s){
      var q = qtdNaTela(s);
      out += '<tr>'
        + '<td class="nomecel"><span class="ponto" style="background:' + esc(s.cor || '#A56B3E') + '"></span>'
        + '<button class="editar" data-acao="editar" data-id="' + esc(s.id) + '" type="button">' + esc(s.nome) + '</button></td>'
        + '<td><input class="cel" inputmode="numeric" data-campo="qtd" data-id="' + esc(s.id) + '" value="' + q + '" aria-label="Quantidade de ' + esc(s.nome) + '"></td>'
        + '<td><input class="cel" inputmode="decimal" data-campo="preco" data-id="' + esc(s.id) + '" value="' + precoBR(s.preco) + '" aria-label="Preço de ' + esc(s.nome) + '"></td>'
        + '<td><input class="cel" inputmode="numeric" data-campo="minimo" data-id="' + esc(s.id) + '" value="' + nn(s.minimo) + '" aria-label="Estoque mínimo de ' + esc(s.nome) + '"></td>'
        + '<td class="valorcel">' + moeda(q * nn(s.preco)) + '</td>'
        + '</tr>';
    });
    out += '</tbody><tfoot><tr><td>Total</td><td class="valorcel">' + t.qtd + '</td><td></td><td></td>'
      + '<td class="valorcel">' + moeda(t.valor) + '</td></tr></tfoot></table></div>';
    out += '<div class="acoes-sheet" style="margin-top:12px">'
      + '<button class="btn fantasma" data-acao="novo-sabor" type="button">+ Novo sabor</button>'
      + '<button class="btn fantasma" data-acao="csv" type="button">Exportar</button></div>';
    return out + rodape();
  }

  /* ============ tela: histórico ============ */
  function telaHistorico(){
    var out = '<div class="secao"><h2>Histórico</h2><span class="dica">' + S.movs.length + ' lançamento' + (S.movs.length === 1 ? '' : 's') + '</span></div>';
    if (!S.movs.length){
      out += '<div class="vazio"><p>Nada lançado ainda</p><small>Cada venda, fornada e ajuste que você fizer aparece aqui com dia e hora.</small></div>';
      return out + rodape();
    }
    var dias = [], mapa = {};
    S.movs.forEach(function(m){
      var d = String(m.ts).slice(0, 10);
      if (!mapa[d]){ mapa[d] = []; dias.push(d); }
      mapa[d].push(m);
    });
    dias.forEach(function(d){
      var r = doDia(d);
      var quando = new Date(d + 'T12:00:00');
      out += '<section class="dia"><div class="dia-cab"><b>' + esc(maiusc1(DIA.format(quando))) + '</b>'
        + '<span>' + r.vendidos + ' vendido' + (r.vendidos === 1 ? '' : 's') + ' · ' + moeda(r.faturamento) + '</span></div>';
      mapa[d].forEach(function(m){
        var mais = nn(m.delta) > 0;
        out += '<div class="mov">'
          + '<span class="hora">' + esc(HORA.format(new Date(m.ts))) + '</span>'
          + '<span class="oq"><b>' + esc(m.sabor) + '</b><span>' + esc(ROTULO[m.tipo] || m.tipo)
          + (m.tipo === 'venda' && nn(m.valor) ? ' · ' + moeda(m.valor) : '') + '</span></span>'
          + '<span class="delta ' + (mais ? 'mais' : 'menos') + '">' + (mais ? '+' : '−') + Math.abs(nn(m.delta)) + '</span>'
          + '<button class="apagar" data-acao="apagar-mov" data-id="' + esc(m.id) + '" aria-label="Apagar lançamento" type="button">' + ICO_LIXO + '</button>'
          + '</div>';
      });
      out += '</section>';
    });
    return out + rodape();
  }

  function rodape(){
    var nuvem = S.fonte === 'nuvem';
    return '<div class="rodape"><span class="sync"><span class="bolinha' + (nuvem ? '' : ' local') + '"></span>'
      + (nuvem ? 'Salvo na nuvem — abre igual em qualquer aparelho' : 'Salvo neste aparelho') + '</span>'
      + '<span>Doceria Maria Formiga</span></div>';
  }

  /* ---- pintura pontual: mantem o botao sob o dedo vivo ---- */
  function pintarCartao(id){
    var cartao = document.querySelector('[data-cartao="' + id + '"]');
    var s = acharSabor(id);
    if (!cartao || !s){ render(); return; }
    var q = qtdNaTela(s), d = deltaFila(id), sit = situacao(s);
    var bq = cartao.querySelector('.qtd');
    if (bq){
      bq.className = 'qtd' + (q ? '' : ' zero');
      bq.innerHTML = '<b>' + q + '</b>' + capQtd(d);
    }
    var pill = cartao.querySelector('.pill');
    if (pill){ pill.className = 'pill ' + sit.cls; pill.textContent = sit.txt; }
    var vl = cartao.querySelector('.vl');
    if (vl) vl.textContent = moeda(q * nn(s.preco));
    var res = document.getElementById('resumo');
    if (res) res.innerHTML = blocoResumo();
    atualizarBarra();
  }

  /* ============ render ============ */
  var elView = document.getElementById('view');
  function focoEmCampo(){
    var a = document.activeElement;
    return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && elView.contains(a));
  }
  function render(){
    if (focoEmCampo()){ sujo = true; atualizarBarra(); return; }
    sujo = false;
    atualizarBarra();
    elView.innerHTML = S.aba === 'planilha' ? telaPlanilha()
      : S.aba === 'historico' ? telaHistorico() : telaEstoque();
  }
  function atualizarBarra(){
    var t = totais();
    document.getElementById('barra-total').textContent = t.qtd;
    document.getElementById('barra-rotulo').textContent = t.qtd === 1 ? 'cookie' : 'cookies';
  }
  elView.addEventListener('focusout', function(){
    setTimeout(function(){ if (sujo && !focoEmCampo()) render(); }, 60);
  });

  /* ============ abas ============ */
  Array.prototype.forEach.call(document.querySelectorAll('[data-aba]'), function(b){
    b.addEventListener('click', function(){
      escoar();
      S.aba = b.getAttribute('data-aba');
      Array.prototype.forEach.call(document.querySelectorAll('[data-aba]'), function(o){
        o.setAttribute('aria-selected', String(o === b));
      });
      render();
      elView.classList.remove('painel');
      void elView.offsetWidth;
      elView.classList.add('painel');
      window.scrollTo({top:0, behavior:'auto'});
    });
  });

  /* ============ bottom sheet ============ */
  var elSheet = document.getElementById('sheet');
  var elBack = document.getElementById('backdrop');
  function abrir(html){
    elSheet.innerHTML = '<div class="puxador"></div>' + html;
    elBack.classList.add('on');
    requestAnimationFrame(function(){ elSheet.classList.add('on'); });
  }
  function fechar(){
    elSheet.classList.remove('on');
    elBack.classList.remove('on');
    setTimeout(function(){ if (!elSheet.classList.contains('on')) elSheet.innerHTML = ''; }, 340);
  }
  elBack.addEventListener('click', fechar);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') fechar(); });

  function cabecalho(cor, titulo){
    return '<div class="sheet-cab"><span class="chip" style="background:' + esc(cor || '#A56B3E') + '"></span>'
      + '<h3>' + esc(titulo) + '</h3>'
      + '<button class="fechar" data-acao="fechar" aria-label="Fechar" type="button">✕</button></div>';
  }

  /* ---- sheet de quantidade (teclado próprio) ---- */
  var kp = {id:null, modo:'venda', txt:''};
  var MODOS = [
    {k:'venda', t:'Vender', s:'sai do estoque'},
    {k:'fornada', t:'Fornada', s:'entra no estoque'},
    {k:'ajuste', t:'Ajustar', s:'contagem certa'}
  ];
  function abrirTeclado(id, modo){
    escoar();
    var s = acharSabor(id);
    if (!s) return;
    kp = {id:id, modo:modo || 'venda', txt:''};
    abrir(cabecalho(s.cor, s.nome) + '<div id="kp"></div>');
    pintarTeclado();
  }
  function pintarTeclado(){
    var alvo = document.getElementById('kp');
    if (!alvo) return;
    var s = acharSabor(kp.id);
    if (!s) { fechar(); return; }
    var atual = nn(s.qtd);
    var digitado = kp.txt === '' ? null : parseInt(kp.txt, 10);
    var base = digitado == null ? (kp.modo === 'ajuste' ? atual : 0) : digitado;
    var depois = kp.modo === 'ajuste' ? base : kp.modo === 'fornada' ? atual + base : Math.max(0, atual - base);
    var previa;
    if (kp.modo === 'ajuste') previa = 'Prateleira: <b>' + atual + '</b> → <b>' + depois + '</b>';
    else if (kp.modo === 'fornada') previa = 'Prateleira: <b>' + atual + '</b> → <b>' + depois + '</b>';
    else previa = 'Prateleira: <b>' + atual + '</b> → <b>' + depois + '</b> · ' + moeda(base * nn(s.preco));

    var h = '<div class="modos" role="group" aria-label="Tipo de lançamento">';
    MODOS.forEach(function(m){
      h += '<button data-modo="' + m.k + '" aria-pressed="' + (kp.modo === m.k) + '" type="button">'
        + m.t + '<small>' + m.s + '</small></button>';
    });
    h += '</div>';
    h += '<div class="visor"><div class="num' + (digitado == null ? ' vazio-num' : '') + '">' + base
      + '</div><div class="previa">' + previa + '</div></div>';
    h += '<div class="teclado">';
    ['1','2','3','4','5','6','7','8','9'].forEach(function(d){ h += '<button data-tecla="' + d + '" type="button">' + d + '</button>'; });
    h += '<button class="aux" data-tecla="C" type="button">limpar</button>'
      + '<button data-tecla="0" type="button">0</button>'
      + '<button class="aux" data-tecla="B" aria-label="Apagar último dígito" type="button">' + ICO_APAGA + '</button>';
    h += '</div>';
    h += '<button class="btn full" data-acao="confirmar" type="button">'
      + (kp.modo === 'venda' ? 'Registrar venda' : kp.modo === 'fornada' ? 'Registrar fornada' : 'Salvar contagem')
      + '</button>';
    alvo.innerHTML = h;
  }

  /* ---- sheet de sabor ---- */
  function abrirSabor(id){
    escoar();
    var s = id ? acharSabor(id) : null;
    if (id && !s) return;
    var novo = !s;
    var cor = s ? (s.cor || CORES[3]) : CORES[3];
    var h = cabecalho(cor, novo ? 'Novo sabor' : s.nome);
    h += '<label class="campo"><span>Nome</span><input id="f-nome" type="text" autocapitalize="words" value="' + esc(s ? s.nome : '') + '" placeholder="Ex.: Red Velvet"></label>';
    h += '<div class="dupla">'
      + '<label class="campo"><span>Preço</span><input id="f-preco" type="text" inputmode="decimal" value="' + (s ? precoBR(s.preco) : '') + '" placeholder="12,00"></label>'
      + '<label class="campo"><span>Avisar abaixo de</span><input id="f-min" type="text" inputmode="numeric" value="' + (s ? nn(s.minimo) : '6') + '" placeholder="6"></label>'
      + '</div>';
    h += '<div class="campo"><span>Cor do sabor</span><div class="cores" id="f-cores">';
    CORES.forEach(function(c){
      h += '<button data-cor="' + c + '" aria-pressed="' + (c.toLowerCase() === String(cor).toLowerCase()) + '" style="background:' + c + '" aria-label="Cor ' + c + '" type="button"></button>';
    });
    h += '</div></div>';
    h += '<div class="acoes-sheet"><button class="btn" data-acao="salvar-sabor" data-id="' + esc(id || '') + '" type="button">'
      + (novo ? 'Cadastrar' : 'Salvar') + '</button>';
    if (!novo) h += '<button class="btn perigo" data-acao="excluir-sabor" data-id="' + esc(id) + '" type="button">Excluir</button>';
    h += '</div>';
    abrir(h);
  }

  /* ---- sheet CSV ---- */
  function montarCSV(){
    var linhas = ['Sabor;Quantidade;Preco;Minimo;Valor em estoque'];
    S.sabores.forEach(function(s){
      var q = nn(s.qtd);
      linhas.push([s.nome, q, precoBR(s.preco), nn(s.minimo), precoBR(q * nn(s.preco))].join(';'));
    });
    linhas.push('');
    linhas.push('Data;Hora;Sabor;Tipo;Quantidade;Valor');
    S.movs.slice().reverse().forEach(function(m){
      var d = new Date(m.ts);
      linhas.push([
        d.toLocaleDateString('pt-BR'), HORA.format(d), m.sabor,
        ROTULO[m.tipo] || m.tipo, nn(m.delta), precoBR(m.valor)
      ].join(';'));
    });
    return linhas.join('\r\n');
  }
  function abrirCSV(){
    var csv = montarCSV();
    var h = cabecalho('#A56B3E', 'Exportar planilha');
    h += '<p class="aviso">Arquivo CSV com ponto e vírgula e vírgula decimal — abre direto no Excel, Numbers e Google Sheets.</p>';
    h += '<textarea class="csv" id="f-csv" readonly>' + esc(csv) + '</textarea>';
    h += '<div class="acoes-sheet"><button class="btn" data-acao="baixar-csv" type="button">Baixar arquivo</button>'
      + '<button class="btn fantasma" data-acao="copiar-csv" type="button">Copiar</button></div>';
    abrir(h);
  }
  function baixarCSV(){
    var csv = '\ufeff' + montarCSV();
    var nome = 'maria-formiga-' + hojeISO() + '.csv';
    if (window.claude && typeof window.claude.use === 'function'){
      window.claude.use('downloads').then(function(d){
        if (!d) return semDownload();
        d.save({filename:nome, data:csv}).then(function(){
          fechar(); toast('Arquivo salvo', nome);
        }).catch(function(e){
          if (e && e.code === 'declined') return;
          semDownload();
        });
      }).catch(function(){ semDownload(); });
    } else alvoManual(csv, nome);
  }
  function semDownload(){
    toast('Use o botão Copiar', 'Aqui o download é bloqueado — cole o texto na sua planilha.');
  }
  function alvoManual(csv, nome){
    try {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
      a.download = nome; document.body.appendChild(a); a.click(); a.remove();
      toast('Arquivo gerado', nome);
    } catch (e) {
      toast('Copie o texto', 'Toque em Copiar e cole na sua planilha.');
    }
  }

  /* ---- confirmação de exclusão de lançamento ---- */
  function abrirApagarMov(id){
    var m = null;
    S.movs.forEach(function(x){ if (x.id === id) m = x; });
    if (!m) return;
    var volta = nn(m.delta) > 0 ? 'sai' : 'volta para';
    var h = cabecalho(m.cor, 'Apagar lançamento');
    h += '<p class="aviso">' + esc(ROTULO[m.tipo] || m.tipo) + ' de ' + Math.abs(nn(m.delta)) + ' ' + esc(m.sabor)
      + '. Ao apagar, a quantidade ' + volta + ' o estoque.</p>';
    h += '<div class="acoes-sheet"><button class="btn perigo" data-acao="confirmar-apagar-mov" data-id="' + esc(id) + '" type="button">Apagar</button>'
      + '<button class="btn fantasma" data-acao="fechar" type="button">Manter</button></div>';
    abrir(h);
  }

  /* ============ toques ============ */
  document.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-acao],[data-tecla],[data-modo],[data-cor]') : null;
    if (!b) return;

    if (b.hasAttribute('data-tecla')){
      var t = b.getAttribute('data-tecla');
      if (t === 'C') kp.txt = '';
      else if (t === 'B') kp.txt = kp.txt.slice(0, -1);
      else if (kp.txt.length < 5) kp.txt = (kp.txt === '0' ? '' : kp.txt) + t;
      pintarTeclado();
      return;
    }
    if (b.hasAttribute('data-modo')){ kp.modo = b.getAttribute('data-modo'); kp.txt = ''; pintarTeclado(); return; }
    if (b.hasAttribute('data-cor')){
      Array.prototype.forEach.call(b.parentNode.children, function(o){ o.setAttribute('aria-pressed', String(o === b)); });
      return;
    }

    var acao = b.getAttribute('data-acao'), id = b.getAttribute('data-id');
    if (acao === 'fechar') return fechar();
    if (acao === 'lancar' || acao === 'vender') return abrirTeclado(id, 'venda');
    if (acao === 'fornada') return abrirTeclado(id, 'fornada');
    if (acao === 'ajustar') return abrirTeclado(id, 'ajuste');
    if (acao === 'editar') return abrirSabor(id);
    if (acao === 'novo-sabor') return abrirSabor(null);
    if (acao === 'csv') return abrirCSV();
    if (acao === 'baixar-csv') return baixarCSV();
    if (acao === 'copiar-csv'){
      var ta = document.getElementById('f-csv');
      if (!ta) return;
      ta.removeAttribute('readonly'); ta.focus(); ta.setSelectionRange(0, ta.value.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      ta.setAttribute('readonly', 'readonly');
      if (!ok && navigator.clipboard) navigator.clipboard.writeText(ta.value).then(function(){ toast('Copiado'); }, function(){});
      else if (ok) toast('Copiado', 'Cole na sua planilha.');
      return;
    }
    if (acao === 'criar-casa'){
      var lista = saboresDaCasa();
      Promise.all(lista.map(criarSabor)).then(function(){
        toast('Sabores criados', 'Chocolatudo, Kinder, Nutella e Ninho.');
      });
      return;
    }
    if (acao === 'confirmar'){
      var s = acharSabor(kp.id);
      var v = kp.txt === '' ? (kp.modo === 'ajuste' ? nn(s && s.qtd) : 0) : parseInt(kp.txt, 10);
      if (!s) return fechar();
      if (kp.modo !== 'ajuste' && !v){ toast('Digite a quantidade'); return; }
      fechar();
      registrar(s, kp.modo, v);
      return;
    }
    if (acao === 'salvar-sabor'){
      var nome = (document.getElementById('f-nome').value || '').trim();
      if (!nome){ toast('Falta o nome do sabor'); return; }
      var preco = lerNumeroBR(document.getElementById('f-preco').value);
      var min = Math.max(0, Math.round(lerNumeroBR(document.getElementById('f-min').value)));
      var corSel = document.querySelector('#f-cores [aria-pressed="true"]');
      var cor = corSel ? corSel.getAttribute('data-cor') : CORES[3];
      fechar();
      if (id){
        atualizarSabor(id, {nome:nome, preco:preco, minimo:min, cor:cor});
        toast('Sabor atualizado', nome);
      } else {
        var novoIdSabor = slug(nome);
        if (acharSabor(novoIdSabor)) novoIdSabor += '-' + novoId().slice(-4);
        var maior = 0;
        S.sabores.forEach(function(x){ maior = Math.max(maior, nn(x.ordem)); });
        criarSabor({id:novoIdSabor, nome:nome, preco:preco, minimo:min, cor:cor, qtd:0, ordem:maior + 10});
        toast('Sabor cadastrado', nome);
      }
      return;
    }
    if (acao === 'excluir-sabor'){
      var alvo = acharSabor(id);
      var h = cabecalho(alvo && alvo.cor, 'Excluir ' + (alvo ? alvo.nome : 'sabor'));
      h += '<p class="aviso">O sabor sai do estoque e da planilha. Os lançamentos antigos continuam no histórico.</p>';
      h += '<div class="acoes-sheet"><button class="btn perigo" data-acao="confirmar-excluir-sabor" data-id="' + esc(id) + '" type="button">Excluir</button>'
        + '<button class="btn fantasma" data-acao="fechar" type="button">Manter</button></div>';
      abrir(h);
      return;
    }
    if (acao === 'confirmar-excluir-sabor'){ fechar(); removerSabor(id); toast('Sabor excluído'); return; }
    if (acao === 'apagar-mov') return abrirApagarMov(id);
    if (acao === 'confirmar-apagar-mov'){
      var mv = null;
      S.movs.forEach(function(x){ if (x.id === id) mv = x; });
      fechar();
      if (!mv) return;
      var sb = acharSabor(mv.saborId);
      Promise.resolve(sb ? atualizarSabor(mv.saborId, {qtd:Math.max(0, nn(sb.qtd) - nn(mv.delta))}) : null)
        .then(function(){ return removerMov(id); })
        .then(function(){ toast('Lançamento apagado'); });
      return;
    }
  });

  /* toques repetidos no stepper (segurar acelera) */
  var repTimer = null, repInt = null;
  function pararRep(){ clearTimeout(repTimer); clearInterval(repInt); repTimer = repInt = null; }
  document.addEventListener('pointerdown', function(e){
    var b = e.target.closest ? e.target.closest('[data-rep]') : null;
    if (!b) return;
    var tipo = b.getAttribute('data-rep'), id = b.getAttribute('data-id');
    var s0 = acharSabor(id);
    if (!s0) return;
    if (tipo === 'venda' && qtdNaTela(s0) <= 0){
      toast('Sem estoque', s0.nome + ' está zerado — registre uma fornada.');
      return;
    }
    var contados = 0;
    var passo = function(){
      var s = acharSabor(id);
      if (!s || ++contados > 240) return pararRep();
      if (tipo === 'venda' && qtdNaTela(s) <= 0) return pararRep();
      enfileirar(s, tipo, 1);
    };
    passo();
    pararRep();
    repTimer = setTimeout(function(){ repInt = setInterval(passo, 170); }, 480);
  });
  ['pointerup', 'pointercancel', 'pointerleave', 'blur'].forEach(function(ev){
    document.addEventListener(ev, pararRep, true);
  });

  /* células da planilha */
  document.addEventListener('change', function(e){
    var el = e.target;
    if (!el.classList || !el.classList.contains('cel')) return;
    var id = el.getAttribute('data-id'), campo = el.getAttribute('data-campo');
    var s = acharSabor(id);
    if (!s) return;
    if (campo === 'qtd'){
      var v = Math.max(0, Math.round(lerNumeroBR(el.value)));
      if (v !== nn(s.qtd)) registrar(s, 'ajuste', v); else render();
    } else if (campo === 'preco'){
      atualizarSabor(id, {preco:lerNumeroBR(el.value)});
    } else if (campo === 'minimo'){
      atualizarSabor(id, {minimo:Math.max(0, Math.round(lerNumeroBR(el.value)))});
    }
  });

  window.addEventListener('pagehide', escoar);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) escoar(); });

  /* ============ partida ============ */
  iniciarLocal();
  render();
  conectarNuvem();
})();
</script>

</body>
</html>
